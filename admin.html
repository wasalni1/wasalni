<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة وصلني</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{--ink:#12263A;--bg:#F3F6F8;--card:#fff;--line:#D9E1E7;--txt:#12263A}@media(prefers-color-scheme:dark){:root{--bg:#0C1824;--card:#16293B;--line:#27425A;--txt:#EAF1F6}}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 Tajawal,sans-serif;background:var(--bg);color:var(--txt)}main{max-width:900px;margin:auto;padding:14px}
input,select,button,textarea{font:inherit;color:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}textarea{width:100%}button{cursor:pointer;font-weight:700}.p{background:#FFB000;color:#12263A;border-color:#FFB000}.d{background:#C0392B;color:#fff;border-color:#C0392B}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}nav button.on{background:var(--ink);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.big{font-size:26px;font-weight:900}
label{display:block;font-size:13px;opacity:.8}img{max-width:100%;max-height:220px;border-radius:8px;margin:4px 4px 0 0}.r{display:flex;gap:6px;flex-wrap:wrap;align-items:end;margin:4px 0}</style></head><body><main id=m></main>
<script>
const $=s=>document.querySelector(s);let K=sessionStorage.k||'',ST=null,tab='stats',ROLE=sessionStorage.role||'',ANAME=sessionStorage.an||'';
async function A(p,b){const r=await fetch('/api/admin/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json','x-admin':K},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
async function doLogin(){try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:$('#un').value,password:$('#k').value})});const j=await r.json();if(!r.ok)throw new Error(j.error);K=j.token;ROLE=j.role||'owner';ANAME=j.name||'';sessionStorage.k=K;sessionStorage.role=ROLE;sessionStorage.an=ANAME;show()}catch(x){T(x.message)}}
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const T=m=>alert(m);
function login(){$('#m').innerHTML='<h2>لوحة إدارة وصلني</h2><div class=card><input id=un placeholder="اسم المستخدم (اتركه فارغاً للمالك)" style="margin-bottom:6px"> <input id=k type=password placeholder="كلمة السر"> <button class=p onclick="doLogin()">دخول</button></div>'}
async function show(){try{await A('stats')}catch(x){K='';return login()}
 const tabs=(TABS[ROLE||'owner']||TABS.owner).split(' ');if(!tabs.includes(tab))tab=tabs[0];$('#m').innerHTML=`<h2>لوحة إدارة وصلني <span style="font-size:14px;opacity:.7">${e(ANAME||'المالك')} · ${e(ROLE||'owner')}</span> ${ROLE&&ROLE!=='owner'?'<button onclick="myPass()">كلمة سري</button>':''} <button onclick="K='';sessionStorage.clear();login()">خروج</button></h2><nav>`+tabs.map(k=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';show()">${TL[k]}</button>`).join('')+'</nav><div id=v></div>';await V[tab]()}
const bal=u=>u.bal<0?`عليه للمنصة <b>${-u.bal}</b>`:u.bal>0?`له عند المنصة <b>${u.bal}</b>`:'لا مستحقات';
const AL={new_device:'دخول من جهاز جديد لنفس الحساب',shared_device:'جهاز مستخدم في أكثر من حساب',device_reused_after_delete:'جهاز حساب محذوف سُجِّل به حساب جديد',gps_off:'أغلق أحد الطرفين الموقع أثناء الرحلة',gps_silent:'انقطع موقع أحد الطرفين أثناء الرحلة'};
const TABS={owner:'stats alerts leads rec pays comm camp drivers agents users rides tickets bc devs chg admins set',manager:'stats alerts leads rec pays comm camp drivers agents users rides tickets bc devs chg',finance:'stats pays comm camp drivers agents users',support:'stats alerts leads rec drivers users tickets devs'};
const TL={stats:'نظرة عامة',alerts:'التنبيهات',leads:'تسجيلات غير مكتملة',rec:'استعادة الحسابات',pays:'المدفوعات',comm:'العمولات والكشوف',camp:'المكافآت والبونص',drivers:'الكباتن',agents:'الوكلاء',users:'العملاء والرصيد',rides:'الرحلات والتقييمات',tickets:'الشكاوى',bc:'الإشعارات',devs:'سجل الأجهزة',chg:'طلبات تغيير الوكيل',admins:'المسؤولون',set:'الإعدادات'};
const IK=()=>crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now();
const TY={ride_pay:'دفع رحلة',wallet_in:'مستلم من محفظة عميل',commission:'عمولة',commission_paid:'سداد عمولة',received:'استلام من الكابتن',paid:'دفع للكابتن',deduction:'خصم',admin_credit:'إضافة من الإدارة',admin_debit:'خصم من الإدارة',admin_transfer:'تحويل من الإدارة',topup:'شحن',bonus:'بونص',bonus_reverse:'إلغاء بونص',agent_share:'عمولة وكيل',payout:'سحب مستحقات'};
const LS_={otp_requested:'طلب الرمز فقط',otp_verified:'أدخل الرمز (الهاتف موثّق) ولم يكمل'};
const ALX={many_devices:'دخول من 3 أجهزة مختلفة خلال 24 ساعة',login_multi_device_attempts:'محاولات دخول فاشلة من أجهزة مختلفة',contact_change:'تغيير بيانات تواصل (بريد)'};
const V={
async camp(){const{campaigns:d}=await A('campaigns');const KL={welcome:'ترحيبي',appreciation:'تقدير',special:'خاصة',incentive:'تحفيزية'},TG={rider:'كل العملاء',driver:'كل الكباتن',all:'الجميع',one:'مستخدم محدد',group:'مجموعة محددة'},SS={active:'نشطة',pending:'مجدولة',cancelled:'ملغاة',expired:'منتهية'};$('#v').innerHTML=`<div class=card><h3>مكافأة جديدة</h3><div class=r><input id=ct placeholder="العنوان"><input id=cd placeholder="الوصف" style="flex:1"></div><div class=r><select id=ck><option value=welcome>بونص ترحيبي</option><option value=appreciation>بونص تقدير</option><option value=special>مكافأة خاصة</option><option value=incentive>مكافأة تحفيزية</option></select><input id=ca type=number step=any placeholder="القيمة" style="width:110px"><select id=cg onchange="$('#cone').style.display=this.value==='sel'?'block':'none'"><option value=rider>كل العملاء</option><option value=driver>كل الكباتن</option><option value=all>الجميع</option><option value=sel>مستخدمون محددون</option></select><input id=cm type=number min=1 value=1 style="width:90px" title="عدد مرات الاستفادة"><label>مرات الاستفادة</label></div><div id=cone style="display:none"><div class=r><input id=cq placeholder="اسم أو هاتف"><button onclick="cfind()">بحث</button></div><div id=cres></div></div><div class=r><div><label>تبدأ (فارغ = الآن)</label><input id=cs type=datetime-local></div><div><label>تنتهي (اختياري)</label><input id=ce type=datetime-local></div><label><input type=checkbox id=cn> غير قابلة للسحب (للعملاء: تُنفق على الرحلات فقط)</label></div><button class=p onclick="cnew()">إنشاء ومنح</button></div>`+d.map(c=>`<div class=card><b>${e(c.title)}</b> · ${KL[c.kind]} · <b>${c.amount}</b> · ${TG[c.target]}${c.users?' ('+c.users+')':''} · <b>${SS[c.status]}</b>${c.nw?' · غير قابلة للسحب':''}<div>${e(c.desc||'')}</div><div>بدأت ${new Date(c.start).toLocaleString('ar-EG')}${c.end?' · تنتهي '+new Date(c.end).toLocaleString('ar-EG'):''} · مرات الاستفادة ${c.maxUses} · مُنحت لـ ${c.granted} مرة · الإجمالي ${c.total} · أنشأها ${e((c.by||{}).name||'')}</div>${['active','pending'].includes(c.status)?`<div class=r>${c.status==='active'?`<button onclick="cact('${c.id}','grant')">منح مرة أخرى (حتى الحد)</button>`:''}<button class=d onclick="cact('${c.id}','cancel')">إلغاء</button><button class=d onclick="cact('${c.id}','cancel',1)">إلغاء مع استرداد ما مُنح</button></div>`:''}</div>`).join('')},
async comm(){const r=await A('commissions');$('#v').innerHTML=`<div class=card>العمولات المستحقة على الكباتن <b>${r.totals.owed}</b> · المتأخرة (أقدم من ${r.dueDays} أيام) <b style="color:#C0392B">${r.totals.overdue}</b> · إجمالي المحصّل <b>${r.totals.collected}</b></div><div class=card style="overflow-x:auto"><table style="width:100%;font-size:14px"><tr><th>الكابتن</th><th>الهاتف</th><th>المستحق</th><th>المتأخر</th><th>المحصّل</th><th>آخر سداد</th><th></th></tr>${r.drivers.map(x=>`<tr style="${x.overdue>0?'color:#C0392B':''}"><td>${e(x.name)}</td><td dir=ltr>${e(x.phone)}</td><td>${x.owed}</td><td>${x.overdue}</td><td>${x.collected}</td><td>${x.lastPaid?new Date(x.lastPaid).toLocaleDateString('ar-EG'):'—'}</td><td><button onclick="stmt('${x.id}')">كشف</button></td></tr>`).join('')}</table></div>`},
async devs(){$('#v').innerHTML=`<div class=r><input id=dq placeholder="اسم / هاتف / موديل / معرّف الجهاز" style="flex:1"><button onclick="devLoad()">بحث</button></div><div id=dl class=card style="overflow-x:auto"></div>`;await devLoad()},
async chg(){const{requests:d}=await A('change-requests');$('#v').innerHTML='<p>كابتن يطلب الانتقال من وضعه الحالي إلى وكيل أو إلى الاستقلال. العمولات السابقة لا تتغير.</p>'+d.map(t=>`<div class=card><b>${e(t.name)}</b> · ${e(t.phone)}<div>من <b>${e(t.fromName)}</b> إلى <b>${e(t.toName)}</b> · ${new Date(t.at).toLocaleString('ar-EG')}</div><div>${e(t.text||'')}</div><div class=r><input id=cn${t.id} placeholder="ملاحظة" style="flex:1"><button class=p onclick="chgAct('${t.id}','approve')">موافقة</button><button class=d onclick="chgAct('${t.id}','reject')">رفض</button></div></div>`).join('')||'لا توجد طلبات'},
async admins(){const{admins:d}=await A('admins');$('#v').innerHTML=`<div class=card><h3>إضافة مسؤول</h3><div class=r><input id=adn placeholder="الاسم"><input id=adu placeholder="اسم المستخدم (إنجليزي)" dir=ltr><select id=adr><option value=manager>مدير (كل شيء عدا الإعدادات والمسؤولين)</option><option value=finance>محاسب (المدفوعات والمكافآت والعمولات)</option><option value=support>دعم (التنبيهات والشكاوى والاستعادة)</option></select><button class=p onclick="adNew()">إنشاء</button></div><p>تظهر كلمة السر المؤقتة مرة واحدة. كل عملية يجريها المسؤول تُسجَّل باسمه.</p></div>`+d.map(a=>`<div class=card><b>${e(a.name)}</b> · <span dir=ltr>${e(a.user)}</span> · ${e(a.role)} · ${a.active?'نشط':'موقوف'}<div class=r><select id=ro${a.id}>${['manager','finance','support'].map(r=>`<option ${a.role===r?'selected':''}>${r}</option>`).join('')}</select><button onclick="adSet('${a.id}',{role:$('#ro${a.id}').value})">تغيير الدور</button><button onclick="adSet('${a.id}',{active:${!a.active}})">${a.active?'إيقاف':'تفعيل'}</button><button onclick="adSet('${a.id}',{resetPassword:true})">كلمة سر مؤقتة</button></div></div>`).join('')+`<div class=card><button onclick="bk()">تنزيل نسخة احتياطية كاملة (JSON)</button><p>خذ نسخة دورية وخزّنها في مكان آمن. تحتوي بيانات حساسة.</p></div>`},
async alerts(){const{alerts:d}=await A('alerts');$('#v').innerHTML=d.map(a=>`<div class=card style="${a.status==='new'?'border-color:#FFB000':''}"><b>${AL[a.type]||ALX[a.type]||e(a.type)}</b> · ${new Date(a.at).toLocaleString('ar-EG')} · IP ${e(a.ip||'')}<div>الحساب: ${e(a.data.name||'')} ${e(a.data.phone||'')} · ${e(a.uid||'')}</div>${a.data.to?`<div>${e(a.data.from||'')} ← <b>${e(a.data.to)}</b></div>`:''}${a.data.model?`<div>الجهاز: ${e(a.data.model)} ${e(a.data.os||'')}${a.data.previous?` · سابقاً: ${e(a.data.previous.join(' | '))}`:''}</div>`:''}${(a.data.others||[]).map(o=>`<div>حساب آخر: <b>${e(o.name)}</b> ${e(o.phone)} · ${e(o.status)} ${e(o.email||'')}</div>`).join('')}<div class=r><button onclick="alSeen('${a.id}','${a.status==='new'?'seen':'new'}')">${a.status==='new'?'تمت المراجعة':'إعادة'}</button></div></div>`).join('')||'لا تنبيهات'},
async leads(){const{leads:d}=await A('leads');const SL={new:'جديد',contacted:'تمت محاولة التواصل',done:'مكتمل',not_interested:'غير مهتم'};$('#v').innerHTML='<p>أشخاص طلبوا رمز التأكيد ولم يكملوا التسجيل. تواصل معهم لمعرفة السبب.</p>'+d.map(l=>`<div class=card><b>${e(l.name||'بدون اسم')}</b> · ${l.role==='driver'?'كابتن':l.role==='rider'?'عميل':'النوع غير معروف'} · <a dir=ltr href="tel:+${e(l.phone)}">+${e(l.phone)}</a> · <a target=_blank rel=noopener href="https://wa.me/${e(l.phone)}">واتساب</a><div>آخر خطوة: <b>${LS_[l.step]||'—'}</b> · التحقق من الهاتف: <b>${l.phoneVerified?'تم ✓':'لم يتم'}</b></div><div>بدأ ${new Date(l.first).toLocaleString('ar-EG')} · آخر محاولة ${new Date(l.last).toLocaleString('ar-EG')} (${l.count} مرات) · ${e(l.email||'')} · ${e(l.country||'')} · الجهاز ${e((l.dev||{}).model||'')} ${e((l.dev||{}).os||'')} · IP ${e(l.ip||'')}</div><div class=r><select id=ls${l.phone}>${Object.entries(SL).map(([k,v])=>`<option value=${k} ${(l.status||'new')===k?'selected':''}>${v}</option>`).join('')}</select><input id=lr${l.phone} placeholder="سبب عدم الإكمال" value="${e(l.reason||'')}" style="flex:1"><input id=ln${l.phone} placeholder="ملاحظة" value="${e(l.note||'')}" style="flex:1"><button onclick="ldSave('${l.phone}')">حفظ</button></div></div>`).join('')||'لا توجد تسجيلات غير مكتملة'},
async rec(){const{tickets:d}=await A('recoveries');$('#v').innerHTML='<p>للتحقق من صاحب الحساب: اتصل على <b>الرقم المسجل</b> في الحساب (وليس رقماً يعطيك إياه الطالب)، واسأله عن بيانات لا يعرفها غير صاحبها، ثم أنشئ الكود.</p>'+d.map(t=>`<div class=card><b>${e(t.name||'حساب غير موجود')}</b> · <a dir=ltr href="tel:+${e(t.phone)}">+${e(t.phone)}</a> · ${new Date(t.at).toLocaleString('ar-EG')}<div>${e(t.text)} · IP ${e(t.ip||'')} · جهاز الطلب ${e((t.dev||{}).model||'')}</div><div class=r><button class=p onclick="recOpen('${t.id}')">فتح أدلة التحقق</button></div><div id=ev${t.id}></div></div>`).join('')||'لا توجد طلبات استعادة'},
async pays(){const{payments:d}=await A('payments');const KL={commission:'سداد عمولة',ride:'دفع رحلة',topup:'شحن محفظة',payout:'سحب مستحقات وكيل'};$('#v').innerHTML=d.map(p=>`<div class=card style="${p.status==='submitted'?'border-color:#FFB000':''}"><b>${e(p.name)}</b> ${e(p.phone)} · ${KL[p.kind]||e(p.kind)}${p.ride?' '+e(p.ride):''} · <b>${p.amount}</b> · ${e(p.methodName)} · <b>${e(p.status)}</b><div>رقم العملية: <b>${e(p.ref||'—')}</b> · ${new Date(p.at).toLocaleString('ar-EG')}${p.requestedByAdmin?' · بطلب منك':''}</div>${['pending','submitted'].includes(p.status)?`<div class=r><button class=p onclick="pyAct2('${p.id}','confirm','${p.kind}')">${p.kind==='payout'?'تم التحويل للوكيل':'تأكيد استلام المبلغ'}</button><button class=d onclick="pyAct2('${p.id}','reject','${p.kind}')">رفض</button></div>`:''}</div>`).join('')||'لا مدفوعات'},
async agents(){const{agents:d}=await A('agents');$('#v').innerHTML=`<div class=card><h3>إضافة وكيل</h3><div class=r><input id=an placeholder="الاسم"><input id=aph placeholder="الهاتف (بدون كود الدولة)"><input id=aem placeholder="البريد"><input id=aco placeholder="الدولة EG" value="EG" style="width:70px"><input id=acd placeholder="كود مخصص (اختياري، وإلا AGT1001...)" style="width:230px"></div><div class=r><div><label>إجمالي العمولة على كباتنه %</label><input id=adp type=number step=any value=15 style="width:110px"></div><div><label>حصة الوكيل منها %</label><input id=aap type=number step=any value=5 style="width:110px"></div><button class=p onclick="agNew()">إنشاء الوكيل</button></div><p>تُخصم «إجمالي العمولة» من سعر كل رحلة لكباتنه، يأخذ الوكيل «حصته» منها وتبقى لك الباقي. الوكيل لا يغيّر أي نسبة.</p></div>`+d.map(a=>`<div class=card><b>${e(a.name)}</b> · كود <b dir=ltr>${e(a.code)}</b> · ${e(a.status)}<div>📞 ${e(a.phone)} · ✉️ ${e(a.email)} · كباتن ${a.drivers} · رحلات ${a.trips} · مبيعات ${a.gross} · <b>حصتك ${a.companyShare}</b> · أرباح الوكيل ${a.earned} · <b>مستحقاته ${a.bal}</b></div><div class=r><input id=adp${a.id} type=number step=any value="${a.driverPct}" style="width:90px"><input id=aap${a.id} type=number step=any value="${a.agentPct}" style="width:90px"><button onclick="agPct('${a.id}')">حفظ النسب</button><input id=ast${a.id} type=number step=any placeholder="مبلغ" style="width:90px"><button onclick="agPay('${a.id}')">سجّلت دفع مستحقاته</button><button onclick="agPw('${a.id}')">كلمة سر مؤقتة</button><button class=d onclick="agSt('${a.id}','${a.status==='active'?'blocked':'active'}')">${a.status==='active'?'إيقاف':'تفعيل'}</button></div><div class=r><input id=agn${a.id} value="${e(a.name)}"><input id=age${a.id} value="${e(a.email)}"><button onclick="agEdit('${a.id}')">حفظ البيانات</button><button onclick="agDr('${a.id}')">كباتنه</button><button onclick="stmt('${a.id}')">كشف الحساب</button></div><div id=agd${a.id}></div></div>`).join('')},
async stats(){const s=await A('stats');$('#v').innerHTML='<div class=g>'+[['العملاء',s.riders],['الكباتن',s.drivers],['بانتظار الموافقة',s.pending],['شكاوى مفتوحة',s.tickets],['رحلات مكتملة',s.done],['إجمالي المبيعات',s.gross.toFixed(0)],['عمولتك',s.commission.toFixed(0)],['على الكباتن لك',s.owed.toFixed(0)],['لهم عندك',s.payable.toFixed(0)],['أرصدة العملاء',s.wallets.toFixed(0)]].map(([a,b])=>`<div class=card>${a}<div class=big>${b}</div></div>`).join('')+`</div>${s.smsLive?'':'<div class=card style="border-color:#C0392B"><b style="color:#C0392B">رموز التأكيد تظهر على شاشة المستخدم (وضع تجربة).</b> أي شخص يستطيع التسجيل برقم لا يملكه. اربط SMS_WEBHOOK بمزوّد رسائل ليصبح التحقق حقيقياً.</div>'}<div class=card>تنبيهات جديدة <b>${s.alerts}</b> · تسجيلات غير مكتملة <b>${s.leads}</b> · طلبات استعادة <b>${s.recoveries}</b> · مدفوعات بانتظار التأكيد <b>${s.payPending}</b> · مستحقات الوكلاء <b>${s.agentsOwed}</b></div><div class=card>السجل الأمني: <b>${s.auditCount}</b> حدثاً · <a href="/audit.html" target=_blank>المدقق الأمني</a>${s.auditSeparate?'':' <b style="color:#C0392B">— اضبط AUDIT_PASSWORD منفصلة في Render</b>'}</div><div class=card>التخزين: <b>${e(s.storage)}</b>${s.storage==='ملف محلي'?' — تضيع البيانات على Render المجاني. اربط Supabase.':''}</div><div class=card>كباتن مستقلون <b>${s.independentDrivers}</b> · تابعون لوكلاء <b>${s.affiliatedDrivers}</b></div><p>الأرقام بوحدات الدول المختلفة ومجمّعة للمتابعة السريعة.</p>`},

function put(o,p,v){const k=p.split('.');while(k.length>1)o=o[k.shift()];o[k[0]]=v}
async function sv(again){document.querySelectorAll('[data-p]').forEach(i=>{let v=i.value;if(i.dataset.b)v=v==='true';else if(i.dataset.n)v=+v;else if(i.type==='number')v=+v;put(ST,i.dataset.p,v)});try{await A('settings',{settings:ST});again?show():T('تم الحفظ')}catch(x){T(x.message)}}
function addC(){const c=$('#nc').value.toUpperCase();if(!c||!$('#nn').value)return T('أكمل بيانات الدولة');ST.countries[c]={n:$('#nn').value,cur:$('#ncu').value,f:+$('#nf').value||1,dial:$('#ndi').value.replace(/\D/g,''),re:$('#nre').value||undefined,min:7,max:12,on:1,c:[+$('#nla').value||0,+$('#nlo').value||0]};sv(1)}
