<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة وصلني</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{--ink:#12263A;--bg:#F3F6F8;--card:#fff;--line:#D9E1E7;--txt:#12263A}@media(prefers-color-scheme:dark){:root{--bg:#0C1824;--card:#16293B;--line:#27425A;--txt:#EAF1F6}}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 Tajawal,sans-serif;background:var(--bg);color:var(--txt)}main{max-width:900px;margin:auto;padding:14px}
input,select,button{font:inherit;color:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}button{cursor:pointer;font-weight:700}.p{background:#FFB000;color:#12263A;border-color:#FFB000}.d{background:#C0392B;color:#fff;border-color:#C0392B}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}nav button.on{background:var(--ink);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.big{font-size:26px;font-weight:900}
label{display:block;font-size:13px;opacity:.8}img{max-width:100%;max-height:220px;border-radius:8px;margin:4px 4px 0 0}.r{display:flex;gap:6px;flex-wrap:wrap;align-items:end}</style></head><body><main id=m></main>
<script>
const $=s=>document.querySelector(s);let K=sessionStorage.k||'',ST=null,tab='stats';
async function A(p,b){const r=await fetch('/api/admin/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json','x-admin':K},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const T=m=>alert(m);
function login(){$('#m').innerHTML='<h2>لوحة إدارة وصلني</h2><div class=card><input id=k type=password placeholder="كلمة سر الإدارة"> <button class=p onclick="K=$(\'#k\').value;sessionStorage.k=K;show()">دخول</button></div>'}
async function show(){try{await A('stats')}catch(x){K='';return login()}
 $('#m').innerHTML='<h2>لوحة إدارة وصلني</h2><nav>'+[['stats','نظرة عامة'],['drivers','السائقون'],['users','الركاب'],['rides','الرحلات'],['set','الإعدادات']].map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';show()">${v}</button>`).join('')+'</nav><div id=v></div>';await V[tab]()}
const V={
async stats(){const s=await A('stats');$('#v').innerHTML='<div class=g>'+[['الركاب',s.riders],['السائقون',s.drivers],['بانتظار الموافقة',s.pending],['كل الرحلات',s.rides],['رحلات مكتملة',s.done],['إجمالي المبيعات',s.gross.toFixed(0)],['عمولتك',s.commission.toFixed(0)],['عمولة لم تُحصَّل',s.owed.toFixed(0)]].map(([a,b])=>`<div class=card>${a}<div class=big>${b}</div></div>`).join('')+'</div><p>الأرقام بوحدات الدول المختلفة، وهي مجمّعة للمتابعة السريعة.</p>'},
async drivers(){const{drivers:d}=await A('drivers');d.sort((a,b)=>(b.status==='pending')-(a.status==='pending'));$('#v').innerHTML=d.map(u=>`<div class=card><b>${e(u.name)}</b> ${e(u.phone)} ${e(u.email||'')} · ${e(u.country)} · <b>${e(u.status)}</b><div>${e(u.vehicle||'')} ${e(u.model||'')} · ${e(u.plate||'')} · ${e(u.color||'')}</div><div>رحلات ${u.trips} · عمولة مستحقة ${u.owed} · مكافآت ${u.bonus}</div>${u.photoVehicle?`<img src="${u.photoVehicle}"><img src="${u.photoId}">`:''}<div class=r><button class=p onclick="ds('${u.id}','approved')">اعتماد</button><button onclick="rej('${u.id}')">رفض</button><button class=d onclick="ds('${u.id}','blocked')">إيقاف</button><input id=s${u.id} type=number placeholder="مبلغ سداد" style="width:110px"><button onclick="settle('${u.id}')">سجّل سداد العمولة</button></div></div>`).join('')||'لا يوجد سائقون'},
async users(){const{users:d}=await A('users');$('#v').innerHTML=d.map(u=>`<div class=card>${e(u.name)} · ${e(u.phone)} · ${e(u.email||'')} · ${e(u.status)} <button class="${u.status==='blocked'?'p':'d'}" onclick="ub('${u.id}','${u.status==='blocked'?'active':'blocked'}')">${u.status==='blocked'?'تفعيل':'إيقاف'}</button></div>`).join('')||'لا يوجد ركاب'},
async rides(){const{rides:d}=await A('rides');$('#v').innerHTML=d.map(r=>`<div class=card>${e(r.vehicle)} · ${e(r.status)} · ${r.km} كم · ${e(r.riderName)} · سعر ${r.price??r.offer} ${r.commission?'· عمولة '+r.commission:''}</div>`).join('')||'لا توجد رحلات'},
async set(){ST=(await A('settings')).settings;const s=ST;$('#v').innerHTML=`<div class=card><h3>عام</h3><div class=r><div><label>اسم/شعار التطبيق</label><input data-p="logo" value="${e(s.logo)}"></div><div><label>نسبة عمولتك %</label><input data-p="commission" type=number step=any value="${s.commission}"></div><div><label>الدفع الأونلاين</label><select data-p="onlinePay" data-b=1><option value=false>مغلق (كاش فقط)</option><option value=true ${s.onlinePay?'selected':''}>مفعّل (يلزم ربط بوابة دفع)</option></select></div></div></div>
<div class=card><h3>مكافأة السائق</h3><div class=r><div><label>كل كم رحلة في اليوم (0 = إيقاف)</label><input data-p="bonus.trips" type=number value="${s.bonus.trips}"></div><div><label>قيمة المكافأة</label><input data-p="bonus.amount" type=number step=any value="${s.bonus.amount}"></div></div></div>
<div class=card><h3>صفحة الإعلانات (أول فتح التطبيق)</h3><div id=ads>${s.ads.map((a,i)=>`<div class=r><input data-p="ads.${i}.title" value="${e(a.title)}" placeholder="العنوان"><input data-p="ads.${i}.text" value="${e(a.text)}" placeholder="النص" style="flex:1"><select data-p="ads.${i}.on" data-b=1><option value=true>ظاهر</option><option value=false ${a.on?'':'selected'}>مخفي</option></select></div>`).join('')}</div><button onclick="ST.ads.push({title:'',text:'',on:true});sv(1)">+ إعلان</button></div>
<div class=card><h3>المركبات والأسعار (بالجنيه المصري ثم تُضرب في معامل الدولة)</h3>${Object.entries(s.vehicles).map(([k,v])=>`<div class=r><b style="width:140px">${e(v.n)}</b><div><label>فتح العدّاد</label><input data-p="vehicles.${k}.base" type=number step=any value="${v.base}"></div><div><label>سعر الكم</label><input data-p="vehicles.${k}.km" type=number step=any value="${v.km}"></div><select data-p="vehicles.${k}.on" data-n=1><option value=1>مفعّلة</option><option value=0 ${v.on?'':'selected'}>موقوفة</option></select></div>`).join('')}</div>
<div class=card><h3>الدول</h3>${Object.entries(s.countries).map(([k,c])=>`<div class=r><b style="width:90px">${e(c.n)}</b><div><label>العملة</label><input data-p="countries.${k}.cur" value="${e(c.cur)}" style="width:80px"></div><div><label>معامل السعر</label><input data-p="countries.${k}.f" type=number step=any value="${c.f}" style="width:100px"></div><select data-p="countries.${k}.on" data-n=1><option value=1>مفعّلة</option><option value=0 ${c.on?'':'selected'}>موقوفة</option></select></div>`).join('')}<div class=r style="margin-top:10px"><input id=nc placeholder="رمز الدولة US" style="width:90px"><input id=nn placeholder="الاسم"><input id=ncu placeholder="العملة" style="width:80px"><input id=nf type=number step=any placeholder="المعامل" style="width:90px"><input id=nla placeholder="خط عرض" style="width:90px"><input id=nlo placeholder="خط طول" style="width:90px"><button onclick="addC()">+ دولة</button></div></div><button class=p onclick="sv()">حفظ كل التعديلات</button>`}};
function put(o,p,v){const k=p.split('.');while(k.length>1)o=o[k.shift()];o[k[0]]=v}
async function sv(again){document.querySelectorAll('[data-p]').forEach(i=>{let v=i.value;if(i.dataset.b)v=v==='true';else if(i.dataset.n)v=+v;else if(i.type==='number')v=+v;put(ST,i.dataset.p,v)});try{await A('settings',{settings:ST});again?show():T('تم الحفظ')}catch(x){T(x.message)}}
function addC(){const c=$('#nc').value.toUpperCase();if(!c||!$('#nn').value)return T('أكمل بيانات الدولة');ST.countries[c]={n:$('#nn').value,cur:$('#ncu').value,f:+$('#nf').value||1,on:1,c:[+$('#nla').value||0,+$('#nlo').value||0]};sv(1)}
const ds=async(i,s)=>{await A('driver/'+i,{status:s});show()},rej=async i=>{const r=prompt('سبب الرفض؟');if(r!==null){await A('driver/'+i,{status:'rejected',reject:r});show()}},settle=async i=>{const v=+$('#s'+i).value;if(v>0){await A('driver/'+i,{settle:v});show()}},ub=async(i,s)=>{await A('user/'+i,{status:s});show()};
K?show():login();
</script></body></html>
