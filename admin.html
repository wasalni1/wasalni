<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة وصلني</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{--ink:#12263A;--bg:#F3F6F8;--card:#fff;--line:#D9E1E7;--txt:#12263A}@media(prefers-color-scheme:dark){:root{--bg:#0C1824;--card:#16293B;--line:#27425A;--txt:#EAF1F6}}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 Tajawal,sans-serif;background:var(--bg);color:var(--txt)}main{max-width:900px;margin:auto;padding:14px}
input,select,button,textarea{font:inherit;color:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}textarea{width:100%}button{cursor:pointer;font-weight:700}.p{background:#FFB000;color:#12263A;border-color:#FFB000}.d{background:#C0392B;color:#fff;border-color:#C0392B}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}nav button.on{background:var(--ink);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.big{font-size:26px;font-weight:900}
label{display:block;font-size:13px;opacity:.8}img{max-width:100%;max-height:220px;border-radius:8px;margin:4px 4px 0 0}.r{display:flex;gap:6px;flex-wrap:wrap;align-items:end;margin:4px 0}</style></head><body><main id=m></main>
<script>
const $=s=>document.querySelector(s);let K=sessionStorage.k||'',ST=null,tab='stats';
async function A(p,b){const r=await fetch('/api/admin/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json','x-admin':K},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
async function doLogin(){try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#k').value})});const j=await r.json();if(!r.ok)throw new Error(j.error);K=j.token;sessionStorage.k=K;show()}catch(x){T(x.message)}}
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const T=m=>alert(m);
function login(){$('#m').innerHTML='<h2>لوحة إدارة وصلني</h2><div class=card><input id=k type=password placeholder="كلمة سر الإدارة"> <button class=p onclick="doLogin()">دخول</button></div>'}
async function show(){try{await A('stats')}catch(x){K='';return login()}
 $('#m').innerHTML='<h2>لوحة إدارة وصلني</h2><nav>'+[['stats','نظرة عامة'],['alerts','التنبيهات'],['leads','تسجيلات غير مكتملة'],['rec','استعادة الحسابات'],['pays','المدفوعات'],['drivers','السائقون'],['agents','الوكلاء'],['users','الركاب والرصيد'],['rides','الرحلات والتقييمات'],['tickets','الشكاوى'],['bc','الإشعارات والبونص'],['set','الإعدادات']].map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';show()">${v}</button>`).join('')+'</nav><div id=v></div>';await V[tab]()}
const bal=u=>u.bal<0?`عليه للمنصة <b>${-u.bal}</b>`:u.bal>0?`له عند المنصة <b>${u.bal}</b>`:'لا مستحقات';
const AL={new_device:'دخول من جهاز جديد لنفس الحساب',shared_device:'جهاز مستخدم في أكثر من حساب',device_reused_after_delete:'جهاز حساب محذوف سُجِّل به حساب جديد'};
const V={
async alerts(){const{alerts:d}=await A('alerts');$('#v').innerHTML=d.map(a=>`<div class=card style="${a.status==='new'?'border-color:#FFB000':''}"><b>${AL[a.type]||e(a.type)}</b> · ${new Date(a.at).toLocaleString('ar-EG')} · IP ${e(a.ip||'')}<div>الحساب: ${e(a.data.name||'')} ${e(a.data.phone||'')} · ${e(a.uid||'')}</div>${a.data.model?`<div>الجهاز: ${e(a.data.model)} ${e(a.data.os||'')}${a.data.previous?` · سابقاً: ${e(a.data.previous.join(' | '))}`:''}</div>`:''}${(a.data.others||[]).map(o=>`<div>حساب آخر: <b>${e(o.name)}</b> ${e(o.phone)} · ${e(o.status)} ${e(o.email||'')}</div>`).join('')}<div class=r><button onclick="alSeen('${a.id}','${a.status==='new'?'seen':'new'}')">${a.status==='new'?'تمت المراجعة':'إعادة'}</button></div></div>`).join('')||'لا تنبيهات'},
async leads(){const{leads:d}=await A('leads');$('#v').innerHTML='<p>أشخاص طلبوا رمز التأكيد ولم يكملوا التسجيل. تواصل معهم لمعرفة السبب ومساعدتهم.</p>'+d.map(l=>`<div class=card><b>${e(l.name||'بدون اسم')}</b> · <a dir=ltr href="tel:+${e(l.phone)}">+${e(l.phone)}</a> · <a target=_blank rel=noopener href="https://wa.me/${e(l.phone)}">واتساب</a> · ${e(l.status)}<div>${e(l.email||'')} · ${e(l.role||'')} · ${e(l.country||'')} · طلب الرمز ${l.count} مرة · آخر محاولة ${new Date(l.last).toLocaleString('ar-EG')} · الجهاز ${e((l.dev||{}).model||'')} ${e((l.dev||{}).os||'')} · IP ${e(l.ip||'')}</div><div class=r><input id=ln${l.phone} placeholder="ملاحظة" value="${e(l.note||'')}" style="flex:1"><button onclick="ldSet('${l.phone}','contacted')">تم التواصل</button><button onclick="ldSet('${l.phone}','closed')">إغلاق</button></div></div>`).join('')||'لا توجد تسجيلات غير مكتملة'},
async rec(){const{tickets:d}=await A('recoveries');$('#v').innerHTML='<p>للتحقق من صاحب الحساب: اتصل على <b>الرقم المسجل</b> في الحساب (وليس رقماً يعطيك إياه الطالب)، واسأله عن بيانات لا يعرفها غير صاحبها، ثم أنشئ الكود.</p>'+d.map(t=>`<div class=card><b>${e(t.name||'حساب غير موجود')}</b> · <a dir=ltr href="tel:+${e(t.phone)}">+${e(t.phone)}</a> · ${new Date(t.at).toLocaleString('ar-EG')}<div>${e(t.text)} · IP ${e(t.ip||'')} · جهاز الطلب ${e((t.dev||{}).model||'')}</div><div class=r><button class=p onclick="recOpen('${t.id}')">فتح أدلة التحقق</button></div><div id=ev${t.id}></div></div>`).join('')||'لا توجد طلبات استعادة'},
async pays(){const{payments:d}=await A('payments');$('#v').innerHTML=d.map(p=>`<div class=card style="${p.status==='submitted'?'border-color:#FFB000':''}"><b>${e(p.name)}</b> ${e(p.phone)} · ${p.kind==='commission'?'سداد عمولة':p.kind==='ride'?'دفع رحلة '+e(p.ride):'شحن محفظة'} · <b>${p.amount}</b> · ${e(p.methodName)} · <b>${e(p.status)}</b><div>رقم العملية: <b>${e(p.ref||'—')}</b> · ${new Date(p.at).toLocaleString('ar-EG')}${p.requestedByAdmin?' · بطلب منك':''}</div>${['pending','submitted'].includes(p.status)?`<div class=r><button class=p onclick="pyAct('${p.id}','confirm')">تأكيد استلام المبلغ</button><button class=d onclick="pyAct('${p.id}','reject')">رفض</button></div>`:''}</div>`).join('')||'لا مدفوعات'},
async agents(){const{agents:d}=await A('agents');$('#v').innerHTML=`<div class=card><h3>إضافة وكيل</h3><div class=r><input id=an placeholder="الاسم"><input id=aph placeholder="الهاتف (بدون كود الدولة)"><input id=aem placeholder="البريد"><input id=aco placeholder="الدولة EG" value="EG" style="width:70px"><input id=acd placeholder="كود مخصص (اختياري)" style="width:140px"></div><div class=r><div><label>إجمالي العمولة على سائقيه %</label><input id=adp type=number step=any value=15 style="width:110px"></div><div><label>حصة الوكيل منها %</label><input id=aap type=number step=any value=5 style="width:110px"></div><button class=p onclick="agNew()">إنشاء الوكيل</button></div><p>تُخصم «إجمالي العمولة» من سعر كل رحلة لسائقيه، يأخذ الوكيل «حصته» منها وتبقى لك الباقي. الوكيل لا يستطيع تغيير أي نسبة.</p></div>`+d.map(a=>`<div class=card><b>${e(a.name)}</b> · كود <b dir=ltr>${e(a.code)}</b> · ${e(a.status)}<div>📞 ${e(a.phone)} · ✉️ ${e(a.email)} · سائقون ${a.drivers} · رحلات ${a.trips} · مبيعات ${a.gross} · <b>حصتك ${a.companyShare}</b> · أرباح الوكيل ${a.earned} · <b>مستحقاته ${a.bal}</b></div><div class=r><input id=adp${a.id} type=number step=any value="${a.driverPct}" style="width:90px"><input id=aap${a.id} type=number step=any value="${a.agentPct}" style="width:90px"><button onclick="agPct('${a.id}')">حفظ النسب</button><input id=ast${a.id} type=number step=any placeholder="مبلغ" style="width:90px"><button onclick="agPay('${a.id}')">سجّلت دفع مستحقاته</button><button onclick="agPw('${a.id}')">كلمة سر مؤقتة</button><button class=d onclick="agSt('${a.id}','${a.status==='active'?'blocked':'active'}')">${a.status==='active'?'إيقاف':'تفعيل'}</button></div></div>`).join('')},
async stats(){const s=await A('stats');$('#v').innerHTML='<div class=g>'+[['الركاب',s.riders],['السائقون',s.drivers],['بانتظار الموافقة',s.pending],['شكاوى مفتوحة',s.tickets],['رحلات مكتملة',s.done],['إجمالي المبيعات',s.gross.toFixed(0)],['عمولتك',s.commission.toFixed(0)],['على السائقين لك',s.owed.toFixed(0)],['لهم عندك',s.payable.toFixed(0)],['أرصدة الركاب',s.wallets.toFixed(0)]].map(([a,b])=>`<div class=card>${a}<div class=big>${b}</div></div>`).join('')+`</div>${s.smsLive?'':'<div class=card style="border-color:#C0392B"><b style="color:#C0392B">رموز التأكيد تظهر على شاشة المستخدم (وضع تجربة).</b> أي شخص يستطيع التسجيل برقم لا يملكه. اربط SMS_WEBHOOK بمزوّد رسائل ليصبح التحقق حقيقياً.</div>'}<div class=card>تنبيهات جديدة <b>${s.alerts}</b> · تسجيلات غير مكتملة <b>${s.leads}</b> · طلبات استعادة <b>${s.recoveries}</b> · مدفوعات بانتظار التأكيد <b>${s.payPending}</b> · مستحقات الوكلاء <b>${s.agentsOwed}</b></div><div class=card>السجل الأمني: <b>${s.auditCount}</b> حدثاً · <a href="/audit.html" target=_blank>المدقق الأمني</a>${s.auditSeparate?'':' <b style="color:#C0392B">— اضبط AUDIT_PASSWORD منفصلة في Render</b>'}</div><div class=card>التخزين: <b>${e(s.storage)}</b>${s.storage==='ملف محلي'?' — تضيع البيانات على Render المجاني. اربط Supabase.':''}</div><p>الأرقام بوحدات الدول المختلفة ومجمّعة للمتابعة السريعة.</p>`},
async drivers(){const{drivers:d}=await A('drivers');d.sort((a,b)=>(b.status==='pending')-(a.status==='pending'));$('#v').innerHTML=d.map(u=>`<div class=card><div class=r>${u.avatar?`<img src="${u.avatar}" style="width:56px;height:56px;border-radius:50%;object-fit:cover">`:''}<div><b>${e(u.name)}</b> · ${e(u.id)} · <b>${e(u.status)}</b><div>📞 ${e(u.phone)} ${u.pv?'✓':''} · ✉️ ${e(u.email||'')} ${u.ev?'✓':''} · ${e(u.country)} · سجّل ${u.created?new Date(u.created).toLocaleDateString('ar-EG'):''}</div></div></div><div>${e(u.vehicle||'')} ${e(u.model||'')} · ${e(u.plate||'')} · ${e(u.color||'')} ${u.docsLive?'· الصور بالكاميرا':''}</div><div>رحلات <b>${u.trips}</b> · تقييم <b>${u.rating||'—'}</b> (${u.rn}) · مبيعاته ${u.gross} · <b>نسبة الشركة منه ${u.companyShare}</b> · أرباحه ${u.earned} · بونص ${u.bonus} · ${bal(u)}</div>${u.photoVehicle?`<img src="${u.photoVehicle}">`:''}${u.photoId?`<img src="${u.photoId}">`:''}<div class=r><button class=p onclick="ds('${u.id}','approved')">اعتماد</button><button onclick="rej('${u.id}')">رفض</button><button class=d onclick="ds('${u.id}','blocked')">إيقاف</button><button onclick="cm('${u.id}')">تفاصيل العمولة لكل رحلة</button></div><div id=cm${u.id}></div><div class=r><input id=s${u.id} type=number step=any placeholder="مبلغ" style="width:110px"><input id=sr${u.id} placeholder="السبب" style="width:130px"><button onclick="settle('${u.id}',-1)">اخصم من حساب السائق</button><button onclick="settle('${u.id}',1)">أضف لحساب السائق</button></div><div class=r><input id=ag${u.id} placeholder="كود الوكيل (فارغ = بدون وكيل)" style="width:200px" value="${e(u.agentCode||'')}"><button onclick="setAg('${u.id}')">ربط بوكيل</button>${u.agentId?`<span>تابع للوكيل ${e(u.agentId)}</span>`:''}<button onclick="payReq('${u.id}')">أرسل رابط دفع العمولة</button></div><div class=r><input id=b${u.id} type=number step=any placeholder="بونص" style="width:110px"><button onclick="bonus('${u.id}')">أضف بونص</button><button onclick="rv('${u.id}',{phone:true})">اطلب توثيق الهاتف</button><button onclick="rv('${u.id}',{email:true})">اطلب توثيق البريد</button></div></div>`).join('')||'لا يوجد سائقون'},
async users(){const{users:d}=await A('users');$('#v').innerHTML=d.map(u=>`<div class=card><div class=r>${u.avatar?`<img src="${u.avatar}" style="width:56px;height:56px;border-radius:50%;object-fit:cover">`:''}<div><b>${e(u.name)}</b> · ${e(u.id)} · ${e(u.status)}<div>📞 ${e(u.phone)} ${u.pv?'✓':''} · ✉️ ${e(u.email||'')} ${u.ev?'✓':''} · ${e(u.country)} · سجّل ${u.created?new Date(u.created).toLocaleDateString('ar-EG'):''}</div></div></div><div>رصيده <b>${u.wallet}</b></div><div class=r><input id=c${u.id} type=number step=any placeholder="مبلغ (سالب للخصم)" style="width:150px"><button class=p onclick="credit('${u.id}')">شحن الرصيد</button><button class="${u.status==='blocked'?'p':'d'}" onclick="ub('${u.id}','${u.status==='blocked'?'active':'blocked'}')">${u.status==='blocked'?'تفعيل':'إيقاف'}</button><button onclick="payReq('${u.id}')">أرسل رابط شحن</button><button onclick="rvu('${u.id}',{phone:true})">اطلب توثيق الهاتف</button><button onclick="rvu('${u.id}',{email:true})">اطلب توثيق البريد</button></div></div>`).join('')||'لا يوجد ركاب'},
async rides(){const{rides:d}=await A('rides');$('#v').innerHTML='<p>سجلات الرحلات لا تُحذف. تعديل التقييم يُسجَّل في السجل الأمني.</p>'+d.map(r=>`<div class=card>${e(r.id)} · ${e(r.vehicle)} · ${e(r.status)} · ${r.km} كم · ${e(r.riderName)} · سعر ${r.price??r.offer} · ${r.pay==='wallet'?'رصيد':'كاش'} ${r.commission!=null?`· عمولة ${r.commission} (${r.commissionPct}%)`:''}${r.status==='done'?`<div class=r>التقييم: <b>${r.rated||'—'}</b><input id=rt${r.id} type=number min=1 max=5 placeholder="1-5" style="width:70px"><button onclick="rtg('${r.id}')">عدّل</button><button class=d onclick="rtg('${r.id}',1)">احذف التقييم</button></div>`:''}</div>`).join('')||'لا توجد رحلات'},
async tickets(){const{tickets:d}=await A('tickets');$('#v').innerHTML=d.map(t=>`<div class=card><b>${e(t.name)}</b> ${e(t.phone)} · ${e(t.role)} · ${e({complaint:'شكوى',problem:'مشكلة',suggestion:'اقتراح'}[t.type])} · ${e(t.status)}<div>${e(t.text)}</div><div class=r><input id=t${t.id} placeholder="ردك" style="flex:1" value="${e(t.reply||'')}"><button class=p onclick="reply('${t.id}')">رد</button><button onclick="tk('${t.id}','${t.status==='open'?'closed':'open'}')">${t.status==='open'?'إغلاق':'إعادة فتح'}</button></div></div>`).join('')||'لا توجد رسائل'},
async bc(){$('#v').innerHTML=`<div class=card><h3>إرسال إشعار / عرض</h3><div class=r><select id=bro onchange="$('#one').style.display=this.value==='one'?'block':'none'"><option value=rider>كل العملاء</option><option value=driver>كل السائقين</option><option value=all>العملاء والسائقين معاً</option><option value=one>مستخدم محدد</option></select><label><input type=checkbox id=bad checked> أضفه أيضاً لصفحة الإعلانات (للمجموعات فقط)</label></div><div id=one style="display:none"><div class=r><input id=bq placeholder="اسم أو رقم هاتف"><button onclick="fnd()">بحث</button></div><div id=bres></div></div><input id=bt placeholder="العنوان" style="width:100%;margin:4px 0"><textarea id=bx rows=3 placeholder="النص"></textarea><button class=p onclick="bcast()">إرسال الآن</button><p>يصل كإشعار داخل التطبيق وعلى الهاتف لمن فعّل الإشعارات.</p></div>
<div class=card><h3>بونص ترحيبي / تقدير</h3><div class=r><select id=bgt onchange="$('#bgone').style.display=this.value==='one'?'block':'none'"><option value=rider>كل العملاء (يُضاف لمحفظتهم)</option><option value=driver>كل السائقين (يُضاف لحسابهم)</option><option value=all>الجميع</option><option value=one>مستخدم محدد</option></select><select id=bgk><option value=appreciation>بونص تقدير</option><option value=welcome>بونص ترحيبي</option></select><input id=bga type=number step=any placeholder="المبلغ" style="width:100px"><input id=bgm placeholder="رسالة تظهر معه" style="flex:1"></div><div id=bgone style="display:none"><div class=r><input id=bgq placeholder="اسم أو رقم هاتف"><button onclick="fnd2('bgq','bgres','BG')">بحث</button></div><div id=bgres></div></div><button class=p onclick="bgive()">منح البونص</button></div>
<div class=card><h3>تحويل من محفظة عميل إلى سائق</h3><div class=r><input id=tq1 placeholder="ابحث عن العميل"><button onclick="fnd2('tq1','tr1','TF')">بحث</button></div><div id=tr1></div><div class=r><input id=tq2 placeholder="ابحث عن السائق"><button onclick="fnd2('tq2','tr2','TT')">بحث</button></div><div id=tr2></div><div class=r><input id=tam type=number step=any placeholder="المبلغ" style="width:100px"><input id=trs placeholder="السبب" style="flex:1"><button class=p onclick="xfer()">تحويل</button></div></div>`},
async set(){ST=(await A('settings')).settings;const s=ST;$('#v').innerHTML=`<div class=card><h3>عام</h3><div class=r><div><label>اسم/شعار التطبيق</label><input data-p="logo" value="${e(s.logo)}"></div><div><label>نسبة عمولتك %</label><input data-p="commission" type=number step=any value="${s.commission}"></div><div><label>الدفع الأونلاين</label><select data-p="onlinePay" data-b=1><option value=false>مغلق (كاش/رصيد)</option><option value=true ${s.onlinePay?'selected':''}>مفعّل (يلزم ربط بوابة)</option></select></div></div></div>
<div class=card><h3>تواصل معنا (يظهر للمستخدمين)</h3><div class=r><input data-p="contact.phone" placeholder="هاتف" value="${e(s.contact.phone)}"><input data-p="contact.whatsapp" placeholder="واتساب بالكود الدولي" value="${e(s.contact.whatsapp)}"><input data-p="contact.email" placeholder="بريد" value="${e(s.contact.email)}"></div></div>
<div class=card><h3>الدفع الإلكتروني</h3>${['instapay','cash'].map(k=>`<div class=card><b>${k==='instapay'?'InstaPay':'محفظة كاش'}</b><div class=r><select data-p="payments.${k}.on" data-b=1><option value=false>مغلق</option><option value=true ${s.payments[k].on?'selected':''}>مفعّل</option></select><input data-p="payments.${k}.payee" placeholder="اسم/رقم المستلم الذي يظهر للعميل" value="${e(s.payments[k].payee)}" style="flex:1"></div><input data-p="payments.${k}.link" placeholder="رابط الدفع https://... ويمكن استخدام {amount} و{ref}" value="${e(s.payments[k].link)}" style="width:100%;margin:4px 0"><input data-p="payments.${k}.note" placeholder="تعليمات تظهر للعميل" value="${e(s.payments[k].note)}" style="width:100%"></div>`).join('')}<p>المبلغ يُحدَّده الخادم من سعر الرحلة ولا يعدّله العميل. الروابط الشخصية (InstaPay/المحافظ) لا تؤكد الدفع آلياً، فتؤكده أنت يدوياً من تبويب «المدفوعات» بعد مراجعة رقم العملية.</p></div>
<div class=card><h3>البونص الترحيبي التلقائي</h3><div class=r><div><label>للعميل عند التسجيل (0 = إيقاف)</label><input data-p="welcome.rider" type=number step=any value="${s.welcome.rider}"></div><div><label>للسائق عند الاعتماد (0 = إيقاف)</label><input data-p="welcome.driver" type=number step=any value="${s.welcome.driver}"></div></div></div>
<div class=card><h3>مستندات السائق</h3><div class=r><div><label>صورة المركبة</label><select data-p="docs.vehicle" data-b=1><option value=true>إجبارية</option><option value=false ${s.docs.vehicle===false?'selected':''}>مغلقة (غير مطلوبة)</option></select></div><div><label>صورة بطاقة الهوية</label><select data-p="docs.id" data-b=1><option value=true>إجبارية</option><option value=false ${s.docs.id===false?'selected':''}>مغلقة (غير مطلوبة)</option></select></div></div><p>تبقى إجبارية للسائقين إلى أن تغلقها أنت.</p></div><div class=card><h3>الشروط والأحكام</h3><textarea data-p="terms" rows=8>${e(s.terms)}</textarea></div>
<div class=card><h3>مكافأة السائق</h3><div class=r><div><label>كل كم رحلة في اليوم (0 = إيقاف)</label><input data-p="bonus.trips" type=number value="${s.bonus.trips}"></div><div><label>قيمة المكافأة</label><input data-p="bonus.amount" type=number step=any value="${s.bonus.amount}"></div></div></div>
<div class=card><h3>صفحة الإعلانات (أول فتح التطبيق)</h3>${s.ads.map((a,i)=>`<div class=r><input data-p="ads.${i}.title" value="${e(a.title)}" placeholder="العنوان"><input data-p="ads.${i}.text" value="${e(a.text)}" placeholder="النص" style="flex:1"><select data-p="ads.${i}.on" data-b=1><option value=true>ظاهر</option><option value=false ${a.on?'':'selected'}>مخفي</option></select></div>`).join('')}<button onclick="ST.ads.push({title:'',text:'',on:true});sv(1)">+ إعلان</button></div>
<div class=card><h3>المركبات والأسعار (بالجنيه المصري ثم تُضرب في معامل الدولة)</h3>${Object.entries(s.vehicles).map(([k,v])=>`<div class=r><b style="width:140px">${e(v.n)}</b><div><label>فتح العدّاد</label><input data-p="vehicles.${k}.base" type=number step=any value="${v.base}"></div><div><label>سعر الكم</label><input data-p="vehicles.${k}.km" type=number step=any value="${v.km}"></div><select data-p="vehicles.${k}.on" data-n=1><option value=1>مفعّلة</option><option value=0 ${v.on?'':'selected'}>موقوفة</option></select></div>`).join('')}</div>
<div class=card><h3>الدول</h3>${Object.entries(s.countries).map(([k,c])=>`<div class=r><b style="width:90px">${e(c.n)}</b><div><label>العملة</label><input data-p="countries.${k}.cur" value="${e(c.cur)}" style="width:80px"></div><div><label>معامل السعر</label><input data-p="countries.${k}.f" type=number step=any value="${c.f}" style="width:100px"></div><div><label>كود الدولة</label><input data-p="countries.${k}.dial" value="${e(c.dial||'')}" style="width:70px"></div><div><label>نمط الرقم المحلي (Regex)</label><input data-p="countries.${k}.re" value="${e(c.re||'')}" style="width:190px" dir=ltr></div><select data-p="countries.${k}.on" data-n=1><option value=1>مفعّلة</option><option value=0 ${c.on?'':'selected'}>موقوفة</option></select></div>`).join('')}<div class=r style="margin-top:10px"><input id=nc placeholder="رمز الدولة US" style="width:90px"><input id=nn placeholder="الاسم"><input id=ncu placeholder="العملة" style="width:80px"><input id=nf type=number step=any placeholder="المعامل" style="width:90px"><input id=ndi placeholder="كود الدولة 20" style="width:90px"><input id=nre placeholder="Regex للرقم المحلي" style="width:160px" dir=ltr><input id=nla placeholder="خط عرض" style="width:90px"><input id=nlo placeholder="خط طول" style="width:90px"><button onclick="addC()">+ دولة</button></div></div><button class=p onclick="sv()">حفظ كل التعديلات</button>`}};
function put(o,p,v){const k=p.split('.');while(k.length>1)o=o[k.shift()];o[k[0]]=v}
async function sv(again){document.querySelectorAll('[data-p]').forEach(i=>{let v=i.value;if(i.dataset.b)v=v==='true';else if(i.dataset.n)v=+v;else if(i.type==='number')v=+v;put(ST,i.dataset.p,v)});try{await A('settings',{settings:ST});again?show():T('تم الحفظ')}catch(x){T(x.message)}}
function addC(){const c=$('#nc').value.toUpperCase();if(!c||!$('#nn').value)return T('أكمل بيانات الدولة');ST.countries[c]={n:$('#nn').value,cur:$('#ncu').value,f:+$('#nf').value||1,dial:$('#ndi').value.replace(/\D/g,''),re:$('#nre').value||undefined,min:7,max:12,on:1,c:[+$('#nla').value||0,+$('#nlo').value||0]};sv(1)}
const cm=W2(async i=>{const r=await A('driver/'+i+'/rides');$('#cm'+i).innerHTML=`<table style="width:100%;font-size:13px"><tr><th>الرحلة</th><th>التاريخ</th><th>المبلغ</th><th>النسبة</th><th>العمولة</th></tr>${r.rides.map(x=>`<tr><td>${e(x.id)}</td><td>${new Date(x.at).toLocaleDateString('ar-EG')}</td><td>${x.price}</td><td>${x.pct}%</td><td>${x.commission}</td></tr>`).join('')}<tr><th colspan=2>الإجمالي</th><th>${r.price}</th><th></th><th>${r.commission}</th></tr></table>`});
function W2(f){return async(...a)=>{try{await f(...a)}catch(x){T(x.message)}}}
const rtg=W2(async(i,rm)=>{const v=rm?null:+$('#rt'+i).value;if(!rm&&!(v>=1&&v<=5))return T('اكتب رقماً من 1 إلى 5');await A('rating/'+i,{stars:v});show()});
const rv=W2(async(i,q)=>{await A('driver/'+i,{requireVerify:q});T('تم الطلب، سيظهر للمستخدم عند فتح التطبيق')}),rvu=W2(async(i,q)=>{await A('user/'+i,{requireVerify:q});T('تم الطلب، سيظهر للمستخدم عند فتح التطبيق')});
let BU='';const fnd=W2(async()=>{const r=await A('find?q='+encodeURIComponent($('#bq').value));$('#bres').innerHTML=r.users.map(u=>`<label style="display:block"><input type=radio name=bu onclick="BU='${u.id}'"> ${e(u.name)} · ${e(u.phone)} · ${u.role==='driver'?'سائق':'عميل'}</label>`).join('')||'لا نتائج'});
const alSeen=W2(async(i,st)=>{await A('alert/'+i,{status:st});show()}),ldSet=W2(async(p,st)=>{await A('lead/'+p,{status:st,note:$('#ln'+p).value});show()}),pyAct=W2(async(i,a)=>{let n='';if(a==='reject'){n=prompt('سبب الرفض؟')||''}else if(!confirm('هل استلمت المبلغ فعلاً وطابقت رقم العملية؟'))return;await A('payment/'+i,{action:a,note:n});show()});
const recOpen=W2(async i=>{const r=await A('recovery/'+i);const u=r.user;$('#ev'+i).innerHTML=u?`<div class=card><b>بيانات الحساب (اسأل الطالب عنها)</b><div>${e(u.name)} · ${e(u.role)} · ${e(u.country)} · سجّل ${new Date(u.created).toLocaleDateString('ar-EG')} · البريد ${e(u.email||'')}${u.plate?' · لوحة '+e(u.plate):''}</div><div>آخر 3 رحلات: ${r.rides.map(x=>new Date(x.at).toLocaleDateString('ar-EG')+' من '+e(x.from)+' إلى '+e(x.to)+' بـ '+x.price).join(' | ')||'لا رحلات'}</div><div>الأجهزة المعروفة: ${r.devices.map(d=>e(d.model)+' '+e(d.os)).join(' | ')||'—'}</div><div>جهاز الطلب: <b>${r.match.deviceKnown?'معروف ✓':'جديد ✗'}</b> · عنوان IP: <b>${r.match.ipKnown?'معروف ✓':'جديد ✗'}</b></div><div><b>حدّد ما أجريته فعلاً:</b><label><input type=checkbox class=ck${i} value=callback> اتصلت على الرقم المسجل ورد صاحبه</label><label><input type=checkbox class=ck${i} value=questions> أجاب بشكل صحيح عن أسئلة الأمان</label><label><input type=checkbox class=ck${i} value=device ${r.match.deviceKnown?'':'disabled'}> الجهاز معروف</label><label><input type=checkbox class=ck${i} value=ip ${r.match.ipKnown?'':'disabled'}> عنوان IP معروف</label><label><input type=checkbox class=ck${i} value=email> أكّد البريد المسجل</label></div><div class=r><button class=p onclick="recGo('${i}','code')">إنشاء كود استعادة (يصلح 30 دقيقة، مرة واحدة)</button><button onclick="recGo('${i}','temp')">أو كلمة سر مؤقتة</button></div></div>`:'<div class=card>لا يوجد حساب بهذا الرقم.</div>'});
const recGo=W2(async(i,mode)=>{const checks=[...document.querySelectorAll('.ck'+i+':checked')].map(x=>x.value);const r=await A('recovery/'+i+'/issue',{mode,checks});prompt(mode==='code'?'أعطِ هذا الكود لصاحب الحساب هاتفياً (يظهر مرة واحدة):':'أعطِ هذه الكلمة المؤقتة لصاحب الحساب هاتفياً. سيُطلب منه تغييرها عند الدخول:',r.code||r.password);show()});
const agNew=W2(async()=>{const r=await A('agent',{name:$('#an').value,phone:$('#aph').value,email:$('#aem').value,country:$('#aco').value,code:$('#acd').value,driverPct:+$('#adp').value,agentPct:+$('#aap').value});prompt('كود الوكيل '+r.code+'. أعطِه كلمة السر المؤقتة هذه (تظهر مرة واحدة):',r.password);show()}),
agPct=W2(async i=>{await A('agent/'+i,{driverPct:+$('#adp'+i).value,agentPct:+$('#aap'+i).value});show()}),agPay=W2(async i=>{const v=+$('#ast'+i).value;if(v>0){await A('agent/'+i,{settle:-v,reason:'دفع مستحقات'});show()}}),agPw=W2(async i=>{const r=await A('agent/'+i,{resetPassword:true});prompt('كلمة السر المؤقتة (تظهر مرة واحدة):',r.password)}),agSt=W2(async(i,st)=>{await A('agent/'+i,{status:st});show()});
const setAg=W2(async i=>{await A('driver-agent/'+i,{code:$('#ag'+i).value});show()});
const payReq=W2(async i=>{const a=prompt('المبلغ المطلوب دفعه؟');if(!a)return;const m=prompt('الوسيلة: اكتب instapay أو cash','instapay');await A('payment-request',{uid:i,amount:+a,method:m});T('أُرسل طلب الدفع للمستخدم وسيراه في «مدفوعاتي»')});
const SEL={};const fnd2=W2(async(q,res,key)=>{const r=await A('find?q='+encodeURIComponent($('#'+q).value));$('#'+res).innerHTML=r.users.map(u=>`<label style="display:block"><input type=radio name=${res} onclick="SEL['${key}']='${u.id}'"> ${e(u.name)} · ${e(u.phone)} · ${u.role==='driver'?'سائق':'عميل'}</label>`).join('')||'لا نتائج'});
const bgive=W2(async()=>{const r=await A('bonus',{target:$('#bgt').value,uid:SEL.BG,amount:+$('#bga').value,kind:$('#bgk').value,message:$('#bgm').value});T('مُنح البونص لـ '+r.sent+' مستخدم')}),xfer=W2(async()=>{await A('transfer',{from:SEL.TF,to:SEL.TT,amount:+$('#tam').value,reason:$('#trs').value});T('تم التحويل');show()});
const W=f=>async(...a)=>{try{await f(...a)}catch(x){T(x.message)}};
const ds=W(async(i,s)=>{await A('driver/'+i,{status:s});show()}),rej=W(async i=>{const r=prompt('سبب الرفض؟');if(r!==null){await A('driver/'+i,{status:'rejected',reject:r});show()}}),
settle=W(async(i,sg)=>{const v=+$('#s'+i).value;if(v>0){await A('driver/'+i,{settle:sg*v,reason:$('#sr'+i).value});show()}}),bonus=W(async i=>{const v=+$('#b'+i).value;if(v>0){await A('driver/'+i,{bonus:v});show()}}),
ub=W(async(i,s)=>{await A('user/'+i,{status:s});show()}),credit=W(async i=>{const v=+$('#c'+i).value;if(v){await A('user/'+i,{credit:v});show()}}),
reply=W(async i=>{await A('ticket/'+i,{reply:$('#t'+i).value});T('أُرسل الرد للمستخدم');show()}),tk=W(async(i,s)=>{await A('ticket/'+i,{status:s});show()}),
bcast=W(async()=>{const r=await A('broadcast',{target:$('#bro').value,uid:BU,title:$('#bt').value,text:$('#bx').value,ad:$('#bad').checked});T('أُرسل إلى '+r.sent+' مستخدم')});
K?show():login();
</script></body></html>
