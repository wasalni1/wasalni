<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12263A"><title>وصلني</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#12263A;--teal:#0E7C7B;--amber:#FFB000;--bg:#F3F6F8;--line:#D9E1E7;--card:#fff;--txt:#12263A}
@media(prefers-color-scheme:dark){:root{--bg:#0C1824;--card:#16293B;--line:#27425A;--txt:#EAF1F6}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:16px/1.6 Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:520px;margin:auto;min-height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);margin:4px 0 10px}input[type=checkbox]{width:auto;margin:0 0 0 8px}input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.b{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;width:100%}.b.a{background:var(--amber);color:#12263A}.b.g{background:transparent;color:var(--txt);border:1.5px solid var(--line)}.b.s{width:auto;padding:8px 14px}
.splash{flex:1;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:28px}.splash h1{font-size:64px;line-height:1;margin:0;font-weight:900;color:var(--amber)}.splash .ad{border-inline-start:5px solid var(--teal);padding:6px 14px}.splash .ad b{font-size:20px}
.pad{padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
h2{margin:6px 0 12px;font-size:22px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.mut{opacity:.7;font-size:14px}.err{color:#C0392B;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;cursor:pointer;font-weight:700}.chip.on{background:var(--amber);border-color:var(--amber);color:#12263A}.chip.soon{opacity:.55;cursor:default}
#map{height:42vh;min-height:260px;background:#cfd8de}.sheet{padding:14px;background:var(--bg);border-radius:18px 18px 0 0;margin-top:-16px;position:relative;z-index:500;flex:1}
.price{font-size:30px;font-weight:900}.tag{display:inline-block;background:var(--teal);color:#fff;border-radius:8px;padding:1px 10px;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:var(--ink);color:#fff}.top b{color:var(--amber);font-size:22px}.top button,.nav button{background:none;border:1px solid #fff5;color:#fff;border-radius:8px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.nav{display:flex;gap:6px;overflow-x:auto;padding:0 18px 10px;background:var(--ink)}
i{font-style:normal;background:#C0392B;border-radius:10px;padding:0 6px;margin-inline-start:4px;font-size:12px}i:empty{display:none}
.pr{display:flex;gap:10px;align-items:center}.av{flex:none;border-radius:50%;object-fit:cover;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.chat{max-height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin:6px 0}.m{background:var(--line);padding:5px 10px;border-radius:10px;max-width:80%;align-self:flex-start;word-break:break-word}.m.me{align-self:flex-end;background:var(--amber);color:#12263A}
#inst{position:sticky;top:0;z-index:9000;display:flex;gap:8px;align-items:center;background:var(--amber);color:#12263A;padding:8px 12px;font-weight:700}#inst span{flex:1}
#toast{position:fixed;bottom:24px;inset-inline:16px;max-width:488px;margin:auto;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:9999;border:2px solid var(--amber)}
.stars button{background:none;border:0;font-size:34px;cursor:pointer;color:var(--amber)}
</style></head><body><div id="app"></div><div id="toast" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const LS=localStorage,$=s=>document.querySelector(s),app=$('#app');
let S={cfg:null,tok:LS.tok||'',user:null,cc:LS.cc||'',pts:{},veh:'car',est:0,km:0,route:null,timer:null,map:null,lay:{},unread:0,th:''};
async function api(p,b,m){let r;try{r=await fetch('/api/'+p,{method:b?(m||'POST'):'GET',headers:{'content-type':'application/json','x-token':S.tok},body:b?JSON.stringify(b):undefined})}catch{const e=new Error('تعذر الاتصال بالإنترنت');e.status=0;throw e}const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'تعذر الاتصال بالخادم');e.status=r.status;throw e}return j}
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3800)};
const go=f=>async(...a)=>{try{await f(...a)}catch(e){if(e.status===401&&S.user){toast('انتهت الجلسة، سجّل الدخول من جديد');return logout()}toast(e.message)}};
const clear=()=>{clearInterval(S.timer);if(S.map){S.map.remove();S.map=null}S.lay={};if(S.watch){navigator.geolocation.clearWatch(S.watch);S.watch=0}};
const cur=()=>S.cfg.countries[S.cc]||{cur:'',f:1,n:''};const money=n=>(+n).toLocaleString('ar-EG',{maximumFractionDigits:2})+' '+cur().cur;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setHTML(el,h){if(!el||el._h===h)return;el._h=h;const act=document.activeElement,id=act&&act.id,v={},sel=act&&act.selectionStart;el.querySelectorAll('input[id],textarea[id]').forEach(i=>v[i.id]=i.value);el.innerHTML=h;for(const k in v){const i=el.querySelector('#'+k);if(i&&v[k]!=='')i.value=v[k]}if(id){const i=el.querySelector('#'+id);if(i){i.focus();try{i.setSelectionRange(sel,sel)}catch{}}}el.querySelectorAll('.chat').forEach(c=>c.scrollTop=c.scrollHeight)}
const av=(u,s=40)=>u&&u.avatar?`<img class=av src="${u.avatar}" width=${s} height=${s} alt="">`:`<span class=av style="width:${s}px;height:${s}px">${esc((u&&u.name||'?')[0])}</span>`;
const topbar=()=>`<div class="top"><b>${esc(S.cfg.logo)}</b><span class=pr>${av(S.user,28)}<span>${esc(S.user.name)}</span><button onclick="notes()" aria-label="الإشعارات">🔔<i id=nb>${S.unread||''}</i></button></span></div><nav class=nav><button onclick="home()">الرئيسية</button><button onclick="myRides()">رحلاتي</button><button onclick="profile()">حسابي</button><button onclick="contact()">تواصل معنا</button><button onclick="logout()">خروج</button></nav>`;
const rt=u=>u.rating?`★ ${u.rating} (${u.rn})`:'لا تقييمات بعد';
function logout(){clear();LS.removeItem('tok');S.tok='';S.user=null;auth()}

// ===== تثبيت التطبيق =====
let DI=null;const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),stand=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DI=e;banner()});addEventListener('appinstalled',()=>{$('#inst')&&$('#inst').remove()});
function banner(){if(stand()||$('#inst')||Date.now()-(+LS.noinst||0)<864e5)return;const d=document.createElement('div');d.id='inst';d.innerHTML=`<span>ثبّت «${esc(S.cfg?S.cfg.logo:'وصلني')}» على هاتفك</span><button class="b a s" onclick="doInstall()">تثبيت</button><button class="b g s" onclick="noInst()" aria-label="إغلاق">×</button>`;document.body.prepend(d)}
async function doInstall(){if(DI){DI.prompt();await DI.userChoice;DI=null;$('#inst')&&$('#inst').remove()}else toast(ios?'في Safari اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»':'من قائمة المتصفح (⋮) اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»')}
const noInst=()=>{LS.noinst=Date.now();$('#inst')&&$('#inst').remove()};

// ===== الإشعارات =====
const u8=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(s+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0))};
const canPush=()=>'serviceWorker' in navigator&&'PushManager' in window&&typeof Notification!=='undefined';
async function subPush(){const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub){const{key}=await api('vapid');sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(key)})}await api('push',{sub:sub.toJSON()})}
const enablePush=go(async()=>{if(!canPush())throw new Error(ios&&!stand()?'على الآيفون: ثبّت التطبيق على الشاشة الرئيسية أولاً ثم فعّل الإشعارات':'هذا المتصفح لا يدعم الإشعارات');if(await Notification.requestPermission()!=='granted')throw new Error('لم يُسمح بالإشعارات، فعّلها من إعدادات المتصفح');await subPush();toast('تم تفعيل الإشعارات على هذا الجهاز');home()});
const pushCard=()=>typeof Notification!=='undefined'&&Notification.permission==='granted'?'':`<div class=card><b>فعّل الإشعارات</b><div class=mut>لتصلك الطلبات والعروض حتى لو كان التطبيق مغلقاً.</div><button class="b a" style="margin-top:8px" onclick="enablePush()">تفعيل الإشعارات</button></div>`;
async function pollNotes(){if(!S.tok||!S.user)return;try{const r=await api('notes');if(S.seen&&r.unread>S.unread&&r.notes[0])toast('🔔 '+r.notes[0].title+': '+r.notes[0].text);S.unread=r.unread;S.seen=1;const b=$('#nb');if(b)b.textContent=r.unread||''}catch{}}
setInterval(pollNotes,12000);
const notes=go(async()=>{clear();const r=await api('notes');await api('notes/read',{});S.unread=0;app.innerHTML=topbar()+`<div class=pad><h2>الإشعارات</h2>${pushCard()}${r.notes.map(n=>`<div class=card><b>${esc(n.title)}</b><div>${esc(n.text)}</div><div class=mut>${new Date(n.at).toLocaleString('ar-EG')}</div></div>`).join('')||'<div class=mut>لا إشعارات بعد</div>'}</div>`});

// ===== البداية =====
async function boot(){let t=0;for(;;){try{S.cfg=await api('config');break}catch{if(++t>10){app.innerHTML='<div class=pad><h2>تعذر الاتصال بالخادم</h2><button class=b onclick=location.reload()>إعادة المحاولة</button></div>';return}app.innerHTML='<div class=pad><h2>جارٍ تشغيل الخادم...</h2><p class=mut>قد يستغرق ذلك دقيقة.</p></div>';await new Promise(r=>setTimeout(r,5000))}}
 if(S.tok){for(let i=0;i<4;i++){try{S.user=(await api('me')).user;S.cc=S.user.country;break}catch(e){if(e.status===401){S.tok='';LS.removeItem('tok');break}await new Promise(r=>setTimeout(r,3000))}}}
 if(!stand())banner();if(S.user&&canPush()&&Notification.permission==='granted')subPush().catch(()=>{});
 if(S.user&&Date.now()-(+LS.sp||0)<216e5)return home();LS.sp=Date.now();splash()}
function splash(){clear();app.innerHTML=`<div class="splash"><h1>${esc(S.cfg.logo)}</h1><div style="opacity:.8">كل وسائل المواصلات في تطبيق واحد: توكتوك، سيكل، سيارة، باص، مركب.</div>${S.cfg.ads.map(a=>`<div class="ad"><b>${esc(a.title)}</b><div>${esc(a.text)}</div></div>`).join('')}<button class="b a" onclick="next()">ابدأ</button></div>`}
function next(){if(DI&&!LS.asked){LS.asked=1;DI.prompt()}S.user?home():S.cc&&S.cfg.countries[S.cc]?auth():country()}
function country(){app.innerHTML=`<div class="pad"><h2>اختر دولتك</h2>${Object.entries(S.cfg.countries).map(([k,c])=>`<button class="b g" style="margin:5px 0;text-align:start" onclick="pick('${k}')">${esc(c.n)} <span class="mut">(${esc(c.cur)})</span></button>`).join('')}</div>`}
function pick(k){S.cc=k;LS.cc=k;auth()}
function auth(mode='login'){clear();const reg=mode==='reg';app.innerHTML=`<div class="pad"><h2>${reg?'حساب جديد':'تسجيل الدخول'} <span class="tag">${esc(cur().n)}</span></h2>
<input id=ph type=tel inputmode=tel placeholder="رقم الموبايل بالكود الدولي (مثال 201012345678)" autocomplete=tel>
${reg?`<div class="row"><input id=code inputmode=numeric placeholder="رمز التأكيد"><button class="b a s" onclick="sendOtp()">أرسل الرمز</button></div><input id=nm placeholder="الاسم"><input id=em type=email placeholder="البريد الإلكتروني (اختياري، لاستعادة كلمة السر)" autocomplete=email><select id=role><option value=rider>راكب</option><option value=driver>سائق</option></select>`:''}
<input id=pw type=password placeholder="كلمة السر (6 أحرف على الأقل)" autocomplete="${reg?'new-password':'current-password'}">
${reg?`<label style="display:block;margin-bottom:10px"><input type=checkbox id=tc>أوافق على <a href="#" onclick="showTerms();return false">الشروط والأحكام</a></label>`:''}
<button class="b" onclick="${reg?'doReg()':'doLogin()'}">${reg?'إنشاء الحساب':'دخول'}</button>
<p style="text-align:center"><a href="#" onclick="auth('${reg?'login':'reg'}');return false">${reg?'لدي حساب':'ليس لدي حساب'}</a> · <a href="#" onclick="country();return false">تغيير الدولة</a>${reg?'':' · <a href="#" onclick="forgot();return false">نسيت كلمة السر؟</a>'}</p></div>`}
function showTerms(){const d=document.createElement('div');d.id='tm';d.style.cssText='position:fixed;inset:0;background:#000a;z-index:9500;display:flex;align-items:center;padding:16px';d.innerHTML=`<div class=card style="max-height:80vh;overflow:auto;white-space:pre-wrap;width:100%;max-width:488px;margin:auto">${esc(S.cfg.terms)}<button class="b" style="margin-top:10px" onclick="$('#tm').remove()">إغلاق</button></div>`;document.body.append(d)}
const sendOtp=go(async()=>{const r=await api('otp',{phone:$('#ph').value});toast(r.devCode?'وضع التجربة: الرمز '+r.devCode:'تم إرسال الرمز برسالة SMS');if(r.devCode)$('#code').value=r.devCode});
const doReg=go(async()=>{const r=await api('register',{phone:$('#ph').value,code:$('#code').value,name:$('#nm').value,email:$('#em').value,password:$('#pw').value,role:$('#role').value,country:S.cc,terms:$('#tc').checked});S.tok=LS.tok=r.token;S.user=r.user;home()});
const doLogin=go(async()=>{const r=await api('login',{phone:$('#ph').value,password:$('#pw').value});S.tok=LS.tok=r.token;S.user=r.user;S.cc=LS.cc=r.user.country;home()});
function forgot(){app.innerHTML=`<div class=pad><h2>استعادة كلمة السر</h2><input id=fid placeholder="رقم الموبايل أو البريد الإلكتروني"><button class="b a" onclick="sendReset()">أرسل الرمز إلى بريدي</button><div id=fr></div><p style="text-align:center"><a href="#" onclick="auth();return false">رجوع</a></p></div>`}
const sendReset=go(async()=>{const r=await api('forgot',{id:$('#fid').value});toast(r.devCode?'وضع التجربة: الرمز '+r.devCode:'أُرسل الرمز إلى '+r.email);$('#fr').innerHTML=`<input id=fc inputmode=numeric placeholder="الرمز" value="${r.devCode||''}"><input id=fp type=password placeholder="كلمة السر الجديدة (6 أحرف)"><button class=b onclick="doReset()">تغيير كلمة السر</button>`});
const doReset=go(async()=>{await api('reset',{id:$('#fid').value,code:$('#fc').value,password:$('#fp').value});toast('تم تغيير كلمة السر، سجّل الدخول');auth()});
const home=()=>{clear();pollNotes();S.user.role==='driver'?driver():rider()};

// ===== الحساب والتواصل =====
const profile=go(async()=>{clear();const u=S.user=(await api('me')).user;app.innerHTML=topbar()+`<div class=pad><h2>حسابي</h2><div class=card><div class=pr>${av(u,80)}<div><b>${esc(u.name)}</b><div class=mut dir=ltr>+${esc(u.phone)}</div><div>${rt(u)}</div></div></div><label class=mut>صورتك (اختياري، من الكاميرا أو المعرض)</label><input id=pa type=file accept="image/*"><label class=mut>البريد الإلكتروني (لاستعادة كلمة السر)</label><input id=pe type=email value="${esc(u.email||'')}"><button class="b a" onclick="saveProfile()">حفظ</button>${u.avatar?'<button class="b g" style="margin-top:8px" onclick="saveProfile(1)">حذف الصورة</button>':''}</div>
${u.role==='rider'?`<div class=card><div class=mut>رصيدك</div><div class=price>${money(u.wallet)}</div>${(u.tx||[]).map(t=>`<div class=mut>${t.amt>0?'+':''}${money(t.amt)} · ${t.t==='ride'?'رحلة':'شحن'} · ${new Date(t.at).toLocaleDateString('ar-EG')}</div>`).join('')}<div class=mut>لشحن الرصيد تواصل مع الإدارة.</div></div>`:''}
<div class=card><b>تغيير كلمة السر</b><input id=po type=password placeholder="كلمة السر الحالية"><input id=pn type=password placeholder="الجديدة (6 أحرف)"><button class="b g" onclick="chPass()">تغيير</button></div>${pushCard()}<a href="#" onclick="showTerms();return false">الشروط والأحكام</a></div>`});
const saveProfile=go(async rm=>{const f=$('#pa').files[0],b={email:$('#pe').value};if(rm)b.removeAvatar=1;else if(f)b.avatar=await shrink(f,160,.6);const r=await api('profile',b,'PUT');S.user=r.user;toast('تم الحفظ');profile()});
const chPass=go(async()=>{await api('password',{old:$('#po').value,new:$('#pn').value});toast('تم تغيير كلمة السر');profile()});
const contact=go(async()=>{clear();const c=S.cfg.contact||{};app.innerHTML=topbar()+`<div class=pad><h2>تواصل معنا</h2><div class=card>${c.phone?`<div>📞 <a dir=ltr href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>`:''}${c.whatsapp?`<div>💬 <a target=_blank rel=noopener href="https://wa.me/${esc(c.whatsapp.replace(/\D/g,''))}">واتساب</a></div>`:''}${c.email?`<div>✉️ <a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>`:''}${!c.phone&&!c.whatsapp&&!c.email?'<div class=mut>اكتب رسالتك وسنردّ عليك في الإشعارات.</div>':''}</div><div class=card><select id=ct><option value=complaint>شكوى</option><option value=problem>مشكلة في رحلة</option><option value=suggestion>اقتراح</option></select><textarea id=cx rows=4 placeholder="اكتب رسالتك" maxlength=1000></textarea><button class="b a" onclick="sendTicket()">إرسال</button></div></div>`});
const sendTicket=go(async()=>{await api('contact',{type:$('#ct').value,text:$('#cx').value});toast('وصلت رسالتك، سنردّ عليك قريباً');home()});
const myRides=go(async()=>{clear();const{rides}=await api('history');app.innerHTML=topbar()+`<div class=pad><h2>رحلاتي</h2>${rides.map(r=>`<div class=card><div class=row><b>${esc(S.cfg.vehicles[r.vehicle]?.n||r.vehicle)}</b><span class=tag style="flex:none;background:${r.status==='done'?'#0E7C7B':'#C0392B'}">${r.status==='done'?'مكتملة':'ملغاة'}</span></div><div class=mut>${new Date(r.at).toLocaleString('ar-EG')}</div><div>${esc(r.from||'نقطة على الخريطة')} ← ${esc(r.to||'نقطة على الخريطة')}</div><div class=mut>${r.km} كم${r.who?' · '+esc(r.who):''}${r.pay==='wallet'?' · من الرصيد':''}</div>${r.status==='done'?`<div class=price>${money(r.price)}</div>`:''}</div>`).join('')||'<div class=mut>لا توجد رحلات سابقة بعد.</div>'}</div>`});
function shrink(f,m=900,q=.7){return new Promise((ok,no)=>{const i=new Image;i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};i.onerror=()=>no(new Error('صورة غير صالحة'));i.src=URL.createObjectURL(f)})}
const chat=(r,me)=>`<div class=card><b>المحادثة</b><div class=chat>${(r.msgs||[]).map(m=>`<div class="m ${m.f===me?'me':''}">${esc(m.t)}</div>`).join('')||'<span class=mut>لا رسائل بعد</span>'}</div><div class=row><input id=cm placeholder="اكتب رسالة" maxlength=300><button class="b a s" onclick="sendMsg('${r.id}')">إرسال</button></div></div>`;
const sendMsg=go(async id=>{const i=$('#cm'),t=i.value.trim();if(!t)return;i.value='';await api(`rides/${id}/msg`,{text:t})});

// ===== الراكب =====
async function rider(){clear();const m=await api('rides/mine');if(m.ride)return track(m.ride.id);S.pts={};S.route=null;S.km=0;const vs=S.cfg.vehicles;if(!vs[S.veh])S.veh=Object.keys(vs)[0];
 app.innerHTML=topbar()+`<div id=map></div><div class=sheet>${pushCard()}<div class=chips id=vc></div><div id=pts class="card mut">المس الخريطة لتحديد نقطة الانطلاق ثم الوجهة، أو ابحث عن الوجهة.</div><div class=chips id=favs></div>
 <div class=row><input id=q placeholder="ابحث عن الوجهة"><button class="b g s" onclick="search()">بحث</button><button class="b g s" onclick="myLoc()">موقعي</button></div><div id=sr></div><div id=ex></div><div id=pr></div></div>`;
 drawChips();drawFavs();S.map=L.map('map').setView(S.cfg.countries[S.cc]?.c||[26.8,30.8],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(S.map);
 S.map.on('click',e=>setPt(S.pts.from?'to':'from',e.latlng.lat,e.latlng.lng));myLoc(true)}
function drawChips(){$('#vc').innerHTML=Object.entries(S.cfg.vehicles).map(([k,v])=>`<button class="chip ${k===S.veh?'on':''}" onclick="S.veh='${k}';drawChips();quote()">${esc(v.n)}</button>`).join('')+S.cfg.soon.map(s=>`<span class="chip soon">${s} · قريباً</span>`).join('');
 const v=S.veh;$('#ex').innerHTML=v==='busrent'?`<div class=row><input id=hrs type=number min=1 value=4 placeholder="عدد الساعات"><input id=qty type=number min=1 value=20 placeholder="عدد الركاب"></div>`:v==='bus'||v==='boat'?`<input id=qty type=number min=1 value=1 placeholder="عدد الركاب">`:''}
function drawFavs(){const f=S.user.favs||[];$('#favs').innerHTML=f.map((x,i)=>`<span class=chip onclick="useFav(${i})">★ ${esc(x.n)} <b onclick="event.stopPropagation();delFav(${i})" aria-label="حذف">×</b></span>`).join('')}
const useFav=i=>{const f=S.user.favs[i];setPt('to',f.lat,f.lng,f.n);S.map.setView([f.lat,f.lng],13)};
const delFav=go(async i=>{S.user=(await api('fav/del',{i})).user;drawFavs()});
const saveFav=go(async()=>{const t=S.pts.to,n=prompt('اسم هذا المكان؟',t.name||'');if(!n)return;S.user=(await api('fav',{n,lat:t.lat,lng:t.lng})).user;toast('أُضيف إلى المفضلة');drawFavs()});
const myLoc=go(async quiet=>new Promise(ok=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{setPt('from',p.coords.latitude,p.coords.longitude);S.map&&S.map.setView([p.coords.latitude,p.coords.longitude],14);ok()},()=>{if(!quiet)toast('فعّل خدمة الموقع في المتصفح');ok()},{enableHighAccuracy:true,timeout:8000}):ok()));
function setPt(k,lat,lng,name){S.pts[k]={lat,lng,name:name||''};if(S.lay[k])S.lay[k].remove();S.lay[k]=L.marker([lat,lng]).addTo(S.map).bindTooltip(k==='from'?'الانطلاق':'الوجهة');quote()}
const search=go(async()=>{const q=$('#q').value.trim();if(!q)return;const r=await(await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=ar&countrycodes=${S.cc.toLowerCase()}&q=${encodeURIComponent(q)}`)).json();$('#sr').innerHTML=r.map(x=>`<button class="b g" style="margin:3px 0;text-align:start" onclick="setPt('to',${x.lat},${x.lon},'${esc(x.display_name.split(',')[0]).replace(/['&#;]/g,'')}');S.map.setView([${x.lat},${x.lon}],13);$('#sr').innerHTML=''">${esc(x.display_name.slice(0,70))}</button>`).join('')||'<div class=mut>لا نتائج</div>'});
function hav(a,b){const R=6371,d=Math.PI/180,x=Math.sin((b.lat-a.lat)*d/2)**2+Math.cos(a.lat*d)*Math.cos(b.lat*d)*Math.sin((b.lng-a.lng)*d/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
async function quote(){const{from,to}=S.pts;if(!from||!to){$('#pts').textContent=from?'الآن حدّد الوجهة':'حدّد نقطة الانطلاق';return}
 let km=hav(from,to)*1.3,line=[[from.lat,from.lng],[to.lat,to.lng]],real=false;
 try{const r=await(await fetch(`https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`)).json();if(r.routes?.[0]){km=r.routes[0].distance/1000;line=r.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);real=true}}catch{}
 if(!S.map)return;if(S.lay.r)S.lay.r.remove();S.lay.r=L.polyline(line,{color:'#0E7C7B',weight:5,dashArray:real?null:'8'}).addTo(S.map);S.map.fitBounds(S.lay.r.getBounds(),{padding:[30,30]});
 S.km=+km.toFixed(1);S.route=real&&line.length<400?line:null;const v=S.cfg.vehicles[S.veh],c=cur();S.est=Math.max(1,Math.round((v.base+v.km*S.km)*c.f*100)/100);
 $('#pts').innerHTML=`المسافة <b>${S.km} كم</b> ${real?'':'(تقديرية)'} <button class="b g s" onclick="saveFav()">☆ احفظ الوجهة</button>`;
 $('#pr').innerHTML=`<div class=card><div class=mut>السعر التقديري</div><div class=price>${money(S.est)}</div><label class=mut>اقترح سعرك (يستطيع السائق قبوله أو مقابلته بعرض آخر)</label><input id=off type=number step=any value="${S.est}"><label class=mut>طريقة الدفع</label><select id=pay><option value=cash>كاش للسائق</option><option value=wallet>من رصيدي (${money(S.user.wallet||0)})</option><option disabled>دفع إلكتروني (قريباً)</option></select><button class="b a" onclick="request()">اطلب الآن</button></div>`}
const request=go(async()=>{const{from,to}=S.pts;const r=await api('rides',{vehicle:S.veh,from,to,km:S.km,est:S.est,offer:+$('#off').value,pay:$('#pay').value,qty:+($('#qty')?.value||1),hours:+($('#hrs')?.value||0),route:S.route});track(r.ride.id)});

async function track(id){clear();S.th='';const q=()=>'rides/'+id+(S.th?'?lite=1':'');
 const view=r=>{const d=r.driver,el=$('#tk');if(!el)return;if(d&&d.thumb)S.th=d.thumb;let h='';
 if(r.status==='open'){h=`<h2>جارٍ البحث عن سائق...</h2><div class=card>سعرك المقترح: <b>${money(r.offer)}</b> · ${r.pay==='wallet'?'من الرصيد':'كاش'}<div class=row><input id=np type=number step=any value="${r.offer}"><button class="b g s" onclick="newPrice('${r.id}')">عدّل السعر</button></div></div>${r.offers.map(o=>`<div class=card><b>${esc(o.name)}</b> ${o.rating?'★'+o.rating:''} <span class=mut>${esc(o.model)}</span><div class=price>${money(o.price)}</div><button class="b a" onclick="acceptOffer('${r.id}','${o.d}')">اقبل هذا العرض</button></div>`).join('')||'<div class=mut>لم تصل عروض بعد. سيصلك إشعار فور وصولها.</div>'}<button class="b g" onclick="cancel('${r.id}')">إلغاء الطلب</button>`}
 else if(r.status==='done'){h=`<h2>وصلت بسلامة</h2><div class=card>الأجرة: <b>${money(r.price)}</b> ${r.pay==='wallet'?'(خُصمت من رصيدك)':'نقداً للسائق'}</div>${r.rated?'':`<div class=stars>${[1,2,3,4,5].map(n=>`<button onclick="rate('${r.id}',${n})" aria-label="${n}">★</button>`).join('')}</div>`}<button class="b" onclick="rider()">رحلة جديدة</button>`}
 else if(r.status==='cancelled'){h=`<h2>أُلغيت الرحلة</h2><button class="b" onclick="rider()">رحلة جديدة</button>`}
 else{const T={assigned:'السائق في الطريق إليك',arrived:'السائق وصل إلى نقطتك',started:'الرحلة جارية'}[r.status];const th=d.thumb||S.th;h=`<h2>${T}</h2><div class=card><div class=pr>${av(d,56)}<div><b>${esc(d.name)}</b> ${d.rating?'★'+d.rating:''}<div><a href="tel:+${esc(d.phone)}" dir=ltr>+${esc(d.phone)}</a></div></div></div>${th?`<img src="${th}" alt="" style="width:100%;border-radius:10px;margin:8px 0">`:''}<div>${esc(S.cfg.vehicles[r.vehicle]?.n||'')} · ${esc(d.model)} · ${esc(d.color)} · لوحة ${esc(d.plate)}</div><div class=price>${money(r.price)}</div></div>${chat(r,'r')}${r.status!=='started'?`<button class="b g" onclick="cancel('${r.id}')">إلغاء</button>`:''}`}
 setHTML(el,h);if(d&&d.loc&&S.map){if(S.lay.d)S.lay.d.setLatLng(d.loc);else S.lay.d=L.circleMarker(d.loc,{radius:9,color:'#FFB000',fillOpacity:1}).addTo(S.map)}};
 const{ride:r0}=await api(q());app.innerHTML=topbar()+`<div id=map></div><div class=sheet id=tk></div>`;mapInit(r0);view(r0);if(r0.driver&&r0.driver.thumb)S.th=r0.driver.thumb;
 S.timer=setInterval(go(async()=>{const{ride:r}=await api(q());view(r)}),3000)}
function mapInit(r){S.map=L.map('map');L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(S.map);const l=r.route||[[r.from.lat,r.from.lng],[r.to.lat,r.to.lng]];S.lay.r=L.polyline(l,{color:'#0E7C7B',weight:5}).addTo(S.map);L.marker([r.from.lat,r.from.lng]).addTo(S.map);L.marker([r.to.lat,r.to.lng]).addTo(S.map);S.map.fitBounds(S.lay.r.getBounds(),{padding:[30,30]})}
const newPrice=go(async id=>{await api(`rides/${id}/price`,{offer:+$('#np').value});toast('تم تعديل السعر')});
const acceptOffer=go(async(id,d)=>{await api(`rides/${id}/accept`,{driver:d})});
const cancel=go(async id=>{await api(`rides/${id}/status`,{s:'cancelled'})});
const rate=go(async(id,n)=>{await api(`rides/${id}/rate`,{stars:n});toast('شكراً لتقييمك');rider()});

// ===== السائق =====
async function driver(){clear();const u=S.user=(await api('me')).user;
 if(u.status==='incomplete'||u.status==='rejected'){app.innerHTML=topbar()+`<div class=pad><h2>أكمل بياناتك</h2>${u.status==='rejected'?`<div class=err>رُفض طلبك: ${esc(u.reject||'راجع البيانات')}</div>`:''}<select id=dv>${Object.entries(S.cfg.vehicles).map(([k,v])=>`<option value=${k}>${esc(v.n)}</option>`).join('')}</select><input id=dm placeholder="نوع وموديل المركبة"><input id=dp placeholder="رقم اللوحة"><input id=dc placeholder="اللون"><label class=mut>صورة المركبة (إجبارية — كاميرا أو معرض)</label><input id=pv type=file accept="image/*"><label class=mut>صورة بطاقة الهوية (إجبارية — كاميرا أو معرض)</label><input id=pi type=file accept="image/*"><button class="b a" onclick="sendDoc()">أرسل للمراجعة</button></div>`;return}
 if(u.status==='pending'){app.innerHTML=topbar()+`<div class=pad><h2>طلبك قيد المراجعة</h2><p>سيصلك إشعار عند موافقة الإدارة.</p>${pushCard()}<button class="b g" onclick="driver()">تحديث</button></div>`;return}
 if(u.status!=='approved'){app.innerHTML=topbar()+`<div class=pad><h2>الحساب موقوف</h2></div>`;return}
 const bl=u.bal<0?`عليك للمنصة: <b>${money(-u.bal)}</b>`:u.bal>0?`لك عند المنصة: <b>${money(u.bal)}</b>`:'لا مستحقات بينك وبين المنصة';
 app.innerHTML=topbar()+`<div class=pad>${pushCard()}<div class=card id=geo>اسمح بالموقع لتبدأ استقبال الرحلات القريبة</div><div class=row><div class=card>رحلاتك<div class=price>${u.trips}</div></div><div class=card>تقييمك<div class=price style="font-size:22px">${u.rating?'★ '+u.rating:'—'}</div><div class=mut>${u.rn} تقييم</div></div></div><div class=card>أرباحك: <b>${money(u.earned)}</b><br>${bl}<br>البونص: <b>${money(u.bonus)}</b></div>
 ${S.rateRide?`<div class=card><b>قيّم الراكب</b><div class=stars>${[1,2,3,4,5].map(n=>`<button onclick="rateRider('${S.rateRide}',${n})" aria-label="${n}">★</button>`).join('')}</div><button class="b g s" onclick="S.rateRide=null;driver()">تخطي</button></div>`:''}<div id=cur></div><h2>طلبات قريبة</h2><div id=list></div></div>`;
 if(!navigator.geolocation)$('#geo').textContent='المتصفح لا يدعم الموقع';else S.watch=navigator.geolocation.watchPosition(p=>{$('#geo').innerHTML='<b>أنت متصل</b> · الموقع يعمل';if(!S.sent||Date.now()-S.sent>8000){S.sent=Date.now();api('loc',{lat:p.coords.latitude,lng:p.coords.longitude}).catch(()=>{})}},()=>{$('#geo').innerHTML='<span class=err>الموقع مغلق. فعّله من إعدادات المتصفح لتستقبل الرحلات.</span>'},{enableHighAccuracy:true});
 const poll=go(async()=>{const r=await api('rides/open');setHTML($('#cur'),r.cur?curView(r.cur):'');setHTML($('#list'),r.cur?'':r.rides.map(x=>`<div class=card><b>${esc(S.cfg.vehicles[x.vehicle]?.n)}</b> · ${x.km} كم${x.qty>1?' · '+x.qty+' راكب':''}${x.hours?' · '+x.hours+' ساعة':''}<div class=mut>${esc(x.riderName)} · ${x.pay==='wallet'?'الدفع من الرصيد':'كاش'}</div><div>عرض الراكب: <span class=price>${money(x.offer)}</span></div><button class="b a" onclick="drvOffer('${x.id}',0,true)">اقبل ${money(x.offer)}</button><div class=row><input id=o${x.id} type=number step=any placeholder="عرضك" value="${x.myOffer||''}"><button class="b g s" onclick="drvOffer('${x.id}',+$('#o${x.id}').value)">أرسل عرضي</button></div></div>`).join('')||'<div class=mut>لا توجد طلبات الآن، سنحدّث تلقائياً وسيصلك إشعار.</div>')});poll();S.timer=setInterval(poll,4000)}
const NX={assigned:['وصلت للراكب','arrived'],arrived:['ابدأ الرحلة','started'],started:['أنهِ الرحلة','done']};
const curView=r=>`<div class=card><h2>رحلة جارية</h2><div class=pr>${av({name:r.riderName,avatar:r.riderAvatar},44)}<div><b>${esc(r.riderName)}</b><div><a href="tel:+${esc(r.riderPhone)}" dir=ltr>+${esc(r.riderPhone)}</a></div></div></div><div class=mut>${r.km} كم · ${r.pay==='wallet'?'الدفع من رصيد الراكب (لا تحصّل نقداً)':'حصّل الأجرة نقداً'}</div><div class=price>${money(r.price)}</div><a class="b g" style="display:block;text-align:center;margin:6px 0;text-decoration:none" target=_blank href="https://www.google.com/maps/dir/?api=1&destination=${(r.status==='started'?r.to:r.from).lat},${(r.status==='started'?r.to:r.from).lng}">افتح الملاحة</a>${NX[r.status]?`<button class="b a" onclick="step('${r.id}','${NX[r.status][1]}')">${NX[r.status][0]}</button>`:''}${r.status!=='started'?`<button class="b g" style="margin-top:6px" onclick="step('${r.id}','cancelled')">إلغاء</button>`:''}</div>${chat(r,'d')}`;
const step=go(async(id,s)=>{await api(`rides/${id}/status`,{s});if(s==='done'){S.rateRide=id;toast('تم. حُدّثت أرباحك')}if(s==='done'||s==='cancelled')driver()});
const rateRider=go(async(id,n)=>{await api(`rides/${id}/rate-rider`,{stars:n});S.rateRide=null;toast('شكراً');driver()});
const drvOffer=go(async(id,p,accept)=>{if(!accept&&!(p>0))throw new Error('اكتب سعراً');await api(`rides/${id}/offer`,{price:p,accept});toast(accept?'تم قبول الرحلة':'أُرسل عرضك للراكب')});
const sendDoc=go(async()=>{const a=$('#pv').files[0],b=$('#pi').files[0];if(!a||!b)throw new Error('صورة المركبة وصورة البطاقة إجباريتان');await api('driver',{vehicle:$('#dv').value,model:$('#dm').value,plate:$('#dp').value,color:$('#dc').value,photoVehicle:await shrink(a),thumbVehicle:await shrink(a,320,.6),photoId:await shrink(b)},'PUT');driver()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
boot();
</script></body></html>
