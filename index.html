<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12263A"><title>وصلني</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#12263A;--teal:#0E7C7B;--amber:#FFB000;--bg:#F3F6F8;--line:#D9E1E7;--card:#fff;--txt:#12263A}
@media(prefers-color-scheme:dark){:root{--bg:#0C1824;--card:#16293B;--line:#27425A;--txt:#EAF1F6}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:16px/1.6 Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:520px;margin:auto;min-height:100%;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);margin:4px 0 10px}input:focus,select:focus,button:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.b{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;width:100%}.b.a{background:var(--amber);color:#12263A}.b.g{background:transparent;color:var(--txt);border:1.5px solid var(--line)}.b.s{width:auto;padding:8px 14px}
.splash{flex:1;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:28px}.splash h1{font-size:64px;line-height:1;margin:0;font-weight:900;color:var(--amber)}.splash .ad{border-inline-start:5px solid var(--teal);padding:6px 14px}.splash .ad b{font-size:20px}
.pad{padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
h2{margin:6px 0 12px;font-size:22px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.mut{opacity:.7;font-size:14px}.err{color:#C0392B;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;cursor:pointer;font-weight:700}.chip.on{background:var(--amber);border-color:var(--amber);color:#12263A}.chip.soon{opacity:.55;cursor:default}
#map{height:42vh;min-height:260px;background:#cfd8de}.sheet{padding:14px;background:var(--bg);border-radius:18px 18px 0 0;margin-top:-16px;position:relative;z-index:500;flex:1}
.price{font-size:30px;font-weight:900}.tag{display:inline-block;background:var(--teal);color:#fff;border-radius:8px;padding:1px 10px;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--ink);color:#fff}.top b{color:var(--amber);font-size:22px}.top button{background:none;border:1px solid #fff5;color:#fff;border-radius:8px;padding:4px 12px}
#toast{position:fixed;bottom:24px;inset-inline:16px;max-width:488px;margin:auto;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:9999;border:2px solid var(--amber)}
.av{flex:none;border-radius:50%;object-fit:cover;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700}.pr{display:flex;gap:10px;align-items:center}
.stars button{background:none;border:0;font-size:34px;cursor:pointer;color:var(--amber)}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}}
</style></head><body><div id="app"></div><div id="toast" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const LS=localStorage,$=s=>document.querySelector(s),app=$('#app');
let S={cfg:null,tok:LS.tok||'',user:null,cc:LS.cc||'',pts:{},veh:'car',est:0,km:0,route:null,timer:null,map:null,lay:{}};
async function api(p,b,m){const r=await fetch('/api/'+p,{method:b?(m||'POST'):'GET',headers:{'content-type':'application/json','x-token':S.tok},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'تعذر الاتصال');return j}
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)};
const go=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e.message)}};
const clear=()=>{clearInterval(S.timer);if(S.map){S.map.remove();S.map=null}S.lay={};if(S.watch){navigator.geolocation.clearWatch(S.watch);S.watch=0}};
const cur=()=>S.cfg.countries[S.cc]||{cur:'',f:1,n:''};const money=n=>(+n).toLocaleString('ar-EG',{maximumFractionDigits:2})+' '+cur().cur;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const av=(u,s=40)=>u&&u.avatar?`<img class=av src="${u.avatar}" width=${s} height=${s} alt="">`:`<span class=av style="width:${s}px;height:${s}px">${esc((u&&u.name||'?')[0])}</span>`;
const topbar=()=>`<div class="top"><b>${esc(S.cfg.logo)}</b><span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${av(S.user,28)} ${esc(S.user.name)} <button onclick="profile()">حسابي</button> <button onclick="myRides()">رحلاتي</button> <button onclick="logout()">خروج</button></span></div>`;
function logout(){clear();LS.removeItem('tok');S.tok='';S.user=null;auth()}

async function boot(){S.cfg=await api('config');if(S.tok){try{S.user=(await api('me')).user;S.cc=S.user.country}catch{S.tok=''}}splash()}
function splash(){clear();const ads=S.cfg.ads;app.innerHTML=`<div class="splash"><h1>${esc(S.cfg.logo)}</h1><div class="mut" style="color:#fff">كل وسائل المواصلات في تطبيق واحد: توكتوك، سيكل، سيارة، باص، مركب.</div>${ads.map(a=>`<div class="ad"><b>${esc(a.title)}</b><div>${esc(a.text)}</div></div>`).join('')}<button class="b a" onclick="next()">ابدأ</button></div>`}
function next(){S.user?home():S.cc&&S.cfg.countries[S.cc]?auth():country()}
function country(){app.innerHTML=`<div class="pad"><h2>اختر دولتك</h2>${Object.entries(S.cfg.countries).map(([k,c])=>`<button class="b g" style="margin:5px 0;text-align:start" onclick="pick('${k}')">${esc(c.n)} <span class="mut">(${esc(c.cur)})</span></button>`).join('')}</div>`}
function pick(k){S.cc=k;LS.cc=k;auth()}
function auth(mode='login'){clear();const reg=mode==='reg';app.innerHTML=`<div class="pad"><h2>${reg?'حساب جديد':'تسجيل الدخول'} <span class="tag">${esc(cur().n)}</span></h2>
<input id=ph type=tel inputmode=tel placeholder="رقم الموبايل بالكود الدولي (مثال 201012345678)" autocomplete=tel>
${reg?`<div class="row"><input id=code inputmode=numeric placeholder="رمز التأكيد"><button class="b a s" onclick="sendOtp()">أرسل الرمز</button></div><input id=nm placeholder="الاسم"><input id=em type=email placeholder="البريد الإلكتروني (اختياري)" autocomplete=email><select id=role><option value=rider>راكب</option><option value=driver>سائق</option></select>`:''}
<input id=pw type=password placeholder="كلمة السر (6 أحرف على الأقل)" autocomplete="${reg?'new-password':'current-password'}"><button class="b" onclick="${reg?'doReg()':'doLogin()'}">${reg?'إنشاء الحساب':'دخول'}</button>
<p style="text-align:center"><a href="#" onclick="auth('${reg?'login':'reg'}');return false">${reg?'لدي حساب':'ليس لدي حساب'}</a> · <a href="#" onclick="country();return false">تغيير الدولة</a></p></div>`}
const sendOtp=go(async()=>{const r=await api('otp',{phone:$('#ph').value});toast(r.devCode?'وضع التجربة: الرمز '+r.devCode:'تم إرسال الرمز برسالة SMS');if(r.devCode)$('#code').value=r.devCode});
const doReg=go(async()=>{const r=await api('register',{phone:$('#ph').value,code:$('#code').value,name:$('#nm').value,email:$('#em').value,password:$('#pw').value,role:$('#role').value,country:S.cc});S.tok=LS.tok=r.token;S.user=r.user;home()});
const doLogin=go(async()=>{const r=await api('login',{phone:$('#ph').value,password:$('#pw').value});S.tok=LS.tok=r.token;S.user=r.user;S.cc=LS.cc=r.user.country;home()});
const home=()=>{clear();S.user.role==='driver'?driver():rider()};

// ===== الراكب =====
async function rider(){clear();const m=await api('rides/mine');if(m.ride)return track(m.ride.id);S.pts={};S.route=null;S.km=0;
 const vs=S.cfg.vehicles;if(!vs[S.veh])S.veh=Object.keys(vs)[0];
 app.innerHTML=topbar()+`<div id=map></div><div class=sheet><div class=chips id=vc></div><div id=pts class="card mut">المس الخريطة لتحديد نقطة الانطلاق ثم الوجهة، أو ابحث عن الوجهة.</div>
 <div class=row><input id=q placeholder="ابحث عن الوجهة"><button class="b g s" onclick="search()">بحث</button><button class="b g s" onclick="myLoc()">موقعي</button></div><div id=sr></div><div id=ex></div><div id=pr></div>
 ${m.history.length?`<div class="mut">رحلاتك السابقة: ${m.history.length}</div>`:''}</div>`;
 drawChips();const c=cur();S.map=L.map('map').setView(S.cfg.countries[S.cc]?.c||[26.8,30.8],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(S.map);
 S.map.on('click',e=>setPt(S.pts.from?'to':'from',e.latlng.lat,e.latlng.lng));myLoc(true)}
function drawChips(){$('#vc').innerHTML=Object.entries(S.cfg.vehicles).map(([k,v])=>`<button class="chip ${k===S.veh?'on':''}" onclick="S.veh='${k}';drawChips();quote()">${esc(v.n)}</button>`).join('')+S.cfg.soon.map(s=>`<span class="chip soon">${s} · قريباً</span>`).join('');
 const v=S.veh;$('#ex').innerHTML=v==='busrent'?`<div class=row><input id=hrs type=number min=1 value=4 placeholder="عدد الساعات"><input id=qty type=number min=1 value=20 placeholder="عدد الركاب"></div>`:v==='bus'||v==='boat'?`<input id=qty type=number min=1 value=1 placeholder="عدد الركاب">`:''}
const myLoc=go(async(quiet)=>new Promise(ok=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{setPt('from',p.coords.latitude,p.coords.longitude);S.map.setView([p.coords.latitude,p.coords.longitude],14);ok()},()=>{if(!quiet)toast('فعّل خدمة الموقع في المتصفح');ok()},{enableHighAccuracy:true,timeout:8000}):ok()));
function setPt(k,lat,lng,name){S.pts[k]={lat,lng,name:name||''};if(S.lay[k])S.lay[k].remove();S.lay[k]=L.marker([lat,lng]).addTo(S.map).bindTooltip(k==='from'?'الانطلاق':'الوجهة');quote()}
const search=go(async()=>{const q=$('#q').value.trim();if(!q)return;const cc=S.cc.toLowerCase();const r=await(await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=ar&countrycodes=${cc}&q=${encodeURIComponent(q)}`)).json();$('#sr').innerHTML=r.map((x,i)=>`<button class="b g" style="margin:3px 0;text-align:start" onclick="setPt('to',${x.lat},${x.lon},'${esc(x.display_name.split(',')[0]).replace(/'/g,'')}');S.map.setView([${x.lat},${x.lon}],13);$('#sr').innerHTML=''">${esc(x.display_name.slice(0,70))}</button>`).join('')||'<div class=mut>لا نتائج</div>'});
function hav(a,b){const R=6371,d=Math.PI/180,x=Math.sin((b.lat-a.lat)*d/2)**2+Math.cos(a.lat*d)*Math.cos(b.lat*d)*Math.sin((b.lng-a.lng)*d/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
async function quote(){const{from,to}=S.pts;if(!from||!to){$('#pts').textContent=from?'الآن حدّد الوجهة':'حدّد نقطة الانطلاق';return}
 let km=hav(from,to)*1.3,line=[[from.lat,from.lng],[to.lat,to.lng]],real=false;
 try{const r=await(await fetch(`https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`)).json();if(r.routes?.[0]){km=r.routes[0].distance/1000;line=r.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);real=true}}catch{}
 if(S.lay.r)S.lay.r.remove();S.lay.r=L.polyline(line,{color:'#0E7C7B',weight:5,dashArray:real?null:'8'}).addTo(S.map);S.map.fitBounds(S.lay.r.getBounds(),{padding:[30,30]});
 S.km=+km.toFixed(1);S.route=real&&line.length<400?line:null;const v=S.cfg.vehicles[S.veh],c=cur();S.est=Math.max(1,Math.round((v.base+v.km*S.km)*c.f*100)/100);
 $('#pts').innerHTML=`المسافة <b>${S.km} كم</b> ${real?'':'(تقديرية)'}`;
 $('#pr').innerHTML=`<div class=card><div class=mut>السعر التقديري</div><div class=price>${money(S.est)}</div><label class=mut>اقترح سعرك (يستطيع السائق قبوله أو مقابلته بعرض آخر)</label><input id=off type=number step=any value="${S.est}"><button class="b a" onclick="request()">اطلب الآن</button></div>`}
const request=go(async()=>{const{from,to}=S.pts;const r=await api('rides',{vehicle:S.veh,from,to,km:S.km,est:S.est,offer:+$('#off').value,qty:+($('#qty')?.value||1),hours:+($('#hrs')?.value||0),route:S.route});track(r.ride.id)});

async function track(id){clear();S.th='';const draw=async()=>{const{ride:r}=await api('rides/'+id+(S.th?'?lite=1':''));if(!$('#tk')||$('#tk').dataset.id!==id)app.innerHTML=topbar()+`<div id=map></div><div class=sheet id=tk data-id="${id}"></div>`,mapInit(r);view(r)};
 const view=r=>{const d=r.driver,el=$('#tk');let h='';if(d&&d.thumb)S.th=d.thumb;
 if(r.status==='open'){h=`<h2>جارٍ البحث عن سائق...</h2><div class=card>سعرك المقترح: <b>${money(r.offer)}</b><div class=row><input id=np type=number step=any value="${r.offer}"><button class="b g s" onclick="newPrice('${r.id}')">عدّل السعر</button></div></div>${r.offers.map(o=>`<div class=card><b>${esc(o.name)}</b> ${o.rating?'★'+o.rating:''} <span class=mut>${esc(o.model)}</span><div class=price>${money(o.price)}</div><button class="b a" onclick="acceptOffer('${r.id}','${o.d}')">اقبل هذا العرض</button></div>`).join('')||'<div class=mut>لم تصل عروض بعد. ستظهر هنا فور وصولها.</div>'}<button class="b g" onclick="cancel('${r.id}')">إلغاء الطلب</button>`}
 else if(r.status==='done'){h=`<h2>وصلت بسلامة</h2><div class=card>الأجرة: <b>${money(r.price)}</b> نقداً للسائق</div>${r.rated?'':`<div class=stars>${[1,2,3,4,5].map(n=>`<button onclick="rate('${r.id}',${n})" aria-label="${n}">★</button>`).join('')}</div>`}<button class="b" onclick="rider()">رحلة جديدة</button>`}
 else if(r.status==='cancelled'){h=`<h2>أُلغيت الرحلة</h2><button class="b" onclick="rider()">رحلة جديدة</button>`}
 else{const T={assigned:'السائق في الطريق إليك',arrived:'السائق وصل إلى نقطتك',started:'الرحلة جارية'}[r.status];h=`<h2>${T}</h2><div class=card><div class=pr>${av(d,56)}<div><b>${esc(d.name)}</b> ${d.rating?'★'+d.rating:''}<div><a href="tel:+${esc(d.phone)}" dir=ltr>+${esc(d.phone)}</a></div></div></div>${d.thumb||S.th?`<img src="${d.thumb||S.th}" alt="" style="width:100%;border-radius:10px;margin:8px 0">`:''}<div>${esc(S.cfg.vehicles[r.vehicle]?.n||'')} · ${esc(d.model)} · ${esc(d.color)} · لوحة ${esc(d.plate)}</div><div class=price>${money(r.price)}</div></div>${r.status!=='started'?`<button class="b g" onclick="cancel('${r.id}')">إلغاء</button>`:''}`}
 el.innerHTML=h;if(d?.loc&&S.map){if(S.lay.d)S.lay.d.setLatLng(d.loc);else S.lay.d=L.circleMarker(d.loc,{radius:9,color:'#FFB000',fillOpacity:1}).addTo(S.map)}};
 await draw();S.timer=setInterval(go(async()=>{const{ride:r}=await api('rides/'+id+(S.th?'?lite=1':''));if($('#tk'))view(r)}),3000)}
function mapInit(r){S.map=L.map('map');L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(S.map);const l=r.route||[[r.from.lat,r.from.lng],[r.to.lat,r.to.lng]];S.lay.r=L.polyline(l,{color:'#0E7C7B',weight:5}).addTo(S.map);L.marker([r.from.lat,r.from.lng]).addTo(S.map);L.marker([r.to.lat,r.to.lng]).addTo(S.map);S.map.fitBounds(S.lay.r.getBounds(),{padding:[30,30]})}
const newPrice=go(async id=>{await api(`rides/${id}/price`,{offer:+$('#np').value});toast('تم تعديل السعر')});
const acceptOffer=go(async(id,d)=>{await api(`rides/${id}/accept`,{driver:d})});
const cancel=go(async id=>{await api(`rides/${id}/status`,{s:'cancelled'})});
const rate=go(async(id,n)=>{await api(`rides/${id}/rate`,{stars:n});toast('شكراً لتقييمك');rider()});

// ===== السائق =====
async function driver(){clear();const u=S.user=(await api('me')).user;
 if(u.status==='incomplete'||u.status==='rejected'){app.innerHTML=topbar()+`<div class=pad><h2>أكمل بياناتك</h2>${u.status==='rejected'?`<div class=err>رُفض طلبك: ${esc(u.reject||'راجع البيانات')}</div>`:''}<select id=dv>${Object.entries(S.cfg.vehicles).map(([k,v])=>`<option value=${k}>${esc(v.n)}</option>`).join('')}</select><input id=dm placeholder="نوع وموديل المركبة"><input id=dp placeholder="رقم اللوحة"><input id=dc placeholder="اللون"><label class=mut>صورة المركبة (إجبارية)</label><input id=pv type=file accept="image/*"><label class=mut>صورة بطاقة الهوية (إجبارية)</label><input id=pi type=file accept="image/*"><button class="b a" onclick="sendDoc()">أرسل للمراجعة</button></div>`;return}
 if(u.status==='pending'){app.innerHTML=topbar()+`<div class=pad><h2>طلبك قيد المراجعة</h2><p>ستتمكن من استقبال الرحلات بعد موافقة الإدارة. افتح التطبيق لاحقاً.</p><button class="b g" onclick="driver()">تحديث</button></div>`;return}
 if(u.status!=='approved'){app.innerHTML=topbar()+`<div class=pad><h2>الحساب موقوف</h2></div>`;return}
 app.innerHTML=topbar()+`<div class=pad><div class=card id=geo class=mut>اسمح بالموقع لتبدأ استقبال الرحلات القريبة</div><div class=row><div class=card>رحلاتك<div class=price>${u.trips}</div></div><div class=card>أرباحك<div class=price>${money(u.earned)}</div></div></div><div class=card>عمولة مستحقة للمنصة: <b>${money(u.owed)}</b> · مكافآت: <b>${money(u.bonus)}</b></div><div id=cur></div><h2>طلبات قريبة</h2><div id=list></div></div>`;
 if(!navigator.geolocation)$('#geo').textContent='المتصفح لا يدعم الموقع';else S.watch=navigator.geolocation.watchPosition(p=>{$('#geo').innerHTML='<b>أنت متصل</b> · الموقع يعمل';S.lastLoc=p;if(!S.sent||Date.now()-S.sent>8000){S.sent=Date.now();api('loc',{lat:p.coords.latitude,lng:p.coords.longitude}).catch(()=>{})}},()=>{$('#geo').innerHTML='<span class=err>الموقع مغلق. فعّله من إعدادات المتصفح لتستقبل الرحلات.</span>'},{enableHighAccuracy:true});
 const poll=go(async()=>{const r=await api('rides/open');$('#cur')&&($('#cur').innerHTML=r.cur?curView(r.cur):'');$('#list')&&($('#list').innerHTML=r.cur?'':r.rides.map(x=>`<div class=card><b>${esc(S.cfg.vehicles[x.vehicle]?.n)}</b> · ${x.km} كم${x.qty>1?' · '+x.qty+' راكب':''}${x.hours?' · '+x.hours+' ساعة':''}<div class=mut>${esc(x.riderName)}</div><div>عرض الراكب: <span class=price>${money(x.offer)}</span></div><button class="b a" onclick="drvOffer('${x.id}',0,true)">اقبل ${money(x.offer)}</button><div class=row><input id=o${x.id} type=number step=any placeholder="عرضك" value="${x.myOffer||''}"><button class="b g s" onclick="drvOffer('${x.id}',+$('#o${x.id}').value)">أرسل عرضي</button></div></div>`).join('')||'<div class=mut>لا توجد طلبات الآن، سنحدّث تلقائياً.</div>')});poll();S.timer=setInterval(poll,4000)}
const NX={assigned:['وصلت للراكب','arrived'],arrived:['ابدأ الرحلة','started'],started:['أنهِ الرحلة وحصّلت الأجرة','done']};
const curView=r=>`<div class=card><h2>رحلة جارية</h2><div class=pr>${av({name:r.riderName,avatar:r.riderAvatar},44)}<div><b>${esc(r.riderName)}</b><div><a href="tel:+${esc(r.riderPhone)}" dir=ltr>+${esc(r.riderPhone)}</a></div></div></div><div class=mut>${r.km} كم</div><div class=price>${money(r.price)}</div><a class="b g" style="display:block;text-align:center;margin:6px 0;text-decoration:none" target=_blank href="https://www.google.com/maps/dir/?api=1&destination=${(r.status==='started'?r.to:r.from).lat},${(r.status==='started'?r.to:r.from).lng}">افتح الملاحة</a>${NX[r.status]?`<button class="b a" onclick="step('${r.id}','${NX[r.status][1]}')">${NX[r.status][0]}</button>`:''}${r.status!=='started'?`<button class="b g" style="margin-top:6px" onclick="step('${r.id}','cancelled')">إلغاء</button>`:''}</div>`;
const step=go(async(id,s)=>{await api(`rides/${id}/status`,{s});if(s==='done'){toast('تم. العمولة أُضيفت لحسابك');driver()}});
const drvOffer=go(async(id,p,accept)=>{if(!accept&&!(p>0))throw new Error('اكتب سعراً');await api(`rides/${id}/offer`,{price:p,accept});toast(accept?'تم قبول الرحلة':'أُرسل عرضك للراكب')});
function shrink(f,m=900,q=.7){return new Promise((ok,no)=>{const i=new Image;i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};i.onerror=()=>no(new Error('صورة غير صالحة'));i.src=URL.createObjectURL(f)})}
const sendDoc=go(async()=>{const a=$('#pv').files[0],b=$('#pi').files[0];if(!a||!b)throw new Error('صورة المركبة وصورة البطاقة إجباريتان');await api('driver',{vehicle:$('#dv').value,model:$('#dm').value,plate:$('#dp').value,color:$('#dc').value,photoVehicle:await shrink(a),thumbVehicle:await shrink(a,320,.6),photoId:await shrink(b)},'PUT');driver()});
const profile=go(async()=>{clear();const u=S.user=(await api('me')).user;app.innerHTML=topbar()+`<div class=pad><button class="b g" onclick="home()">رجوع</button><h2>حسابي</h2><div class=card><div class=pr>${av(u,80)}<div><b>${esc(u.name)}</b><div class=mut dir=ltr>+${esc(u.phone)}</div></div></div><label class=mut>صورتك (اختياري، من الكاميرا أو المعرض)</label><input id=pa type=file accept="image/*"><label class=mut>البريد الإلكتروني (اختياري)</label><input id=pe type=email value="${esc(u.email||'')}"><button class="b a" onclick="saveProfile()">حفظ</button>${u.avatar?'<button class="b g" style="margin-top:8px" onclick="saveProfile(1)">حذف الصورة</button>':''}</div></div>`});
const saveProfile=go(async(rm)=>{const f=$('#pa').files[0],b={email:$('#pe').value};if(rm)b.removeAvatar=1;else if(f)b.avatar=await shrink(f,160,.6);const r=await api('profile',b,'PUT');S.user=r.user;toast('تم الحفظ');profile()});
const myRides=go(async()=>{clear();const{rides}=await api('history');app.innerHTML=topbar()+`<div class=pad><button class="b g" onclick="home()">رجوع</button><h2>رحلاتي</h2>${rides.map(r=>`<div class=card><div class=row><b>${esc(S.cfg.vehicles[r.vehicle]?.n||r.vehicle)}</b><span class=tag style="flex:none;background:${r.status==='done'?'#0E7C7B':'#C0392B'}">${r.status==='done'?'مكتملة':'ملغاة'}</span></div><div class=mut>${new Date(r.at).toLocaleString('ar-EG')}</div><div>${esc(r.from||'نقطة على الخريطة')} ← ${esc(r.to||'نقطة على الخريطة')}</div><div class=mut>${r.km} كم${r.who?' · '+esc(r.who):''}</div>${r.status==='done'?`<div class=price>${money(r.price)}</div>`:''}</div>`).join('')||'<div class=mut>لا توجد رحلات سابقة بعد.</div>'}</div>`});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
boot().catch(()=>app.innerHTML='<div class=pad><h2>تعذر الاتصال بالخادم</h2></div>');
</script></body></html>
