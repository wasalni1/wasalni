<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12263A"><title>وصلني</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--ink:#12263A;--teal:#0E7C7B;--amber:#FFB000;--bg:#F3F6F8;--line:#D9E1E7;--card:#fff;--txt:#12263A}
@media(prefers-color-scheme:dark){:root{--bg:#0C1824;--card:#16293B;--line:#27425A;--txt:#EAF1F6}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:16px/1.6 Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:520px;margin:auto;min-height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);margin:4px 0 10px}input[type=checkbox]{width:auto;margin:0 0 0 8px}input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.b{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;width:100%}.b.a{background:var(--amber);color:#12263A}.b.g{background:transparent;color:var(--txt);border:1.5px solid var(--line)}.b.s{width:auto;padding:8px 14px}
.splash{flex:1;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:28px}.splash h1{font-size:64px;line-height:1;margin:0;font-weight:900;color:var(--amber)}.splash .ad{border-inline-start:5px solid var(--teal);padding:6px 14px}.splash .ad b{font-size:20px}
.pad{padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
h2{margin:6px 0 12px;font-size:22px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.mut{opacity:.7;font-size:14px}.err{color:#C0392B;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;cursor:pointer;font-weight:700}.chip.on{background:var(--amber);border-color:var(--amber);color:#12263A}.chip.soon{opacity:.55;cursor:default}
#map{height:42vh;min-height:260px;background:#cfd8de}.sheet{padding:14px;background:var(--bg);border-radius:18px 18px 0 0;margin-top:-16px;position:relative;z-index:500;flex:1}
.price{font-size:30px;font-weight:900}.tag{display:inline-block;background:var(--teal);color:#fff;border-radius:8px;padding:1px 10px;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:var(--ink);color:#fff}.top b{color:var(--amber);font-size:22px}.top button,.nav button{background:none;border:1px solid #fff5;color:#fff;border-radius:8px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.nav{display:flex;gap:6px;overflow-x:auto;padding:0 18px 10px;background:var(--ink)}
i{font-style:normal;background:#C0392B;border-radius:10px;padding:0 6px;margin-inline-start:4px;font-size:12px}i:empty{display:none}
.pr{display:flex;gap:10px;align-items:center}.av{flex:none;border-radius:50%;object-fit:cover;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.chat{max-height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin:6px 0}.m{background:var(--line);padding:5px 10px;border-radius:10px;max-width:80%;align-self:flex-start;word-break:break-word}.m.me{align-self:flex-end;background:var(--amber);color:#12263A}
#inst{position:sticky;top:0;z-index:9000;display:flex;gap:8px;align-items:center;background:var(--amber);color:#12263A;padding:8px 12px;font-weight:700}#inst span{flex:1}
#toast{position:fixed;bottom:24px;inset-inline:16px;max-width:488px;margin:auto;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:9999;border:2px solid var(--amber)}
.stars button{background:none;border:0;font-size:34px;cursor:pointer;color:var(--amber)}
</style></head><body><div id="app"><div class="splash"><h1>وصلني</h1><div id="ld" style="opacity:.8">جارٍ التحميل…</div></div></div><div id="toast" hidden></div>
<script>
const LS=localStorage,$=s=>document.querySelector(s),app=$('#app');
let S={cfg:null,tok:LS.tok||'',user:null,cc:LS.cc||'',pts:{},veh:'car',est:0,km:0,route:null,timer:null,map:null,lay:{},unread:0,th:''};
async function api(p,b,m){let r;try{r=await fetch('/api/'+p,{method:b?(m||'POST'):'GET',headers:{'content-type':'application/json','x-token':S.tok},body:b?JSON.stringify(b):undefined})}catch{const e=new Error('تعذر الاتصال بالإنترنت');e.status=0;throw e}const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'تعذر الاتصال بالخادم');e.status=r.status;throw e}return j}
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3800)};
const go=f=>async(...a)=>{try{await f(...a)}catch(e){if(e.status===401&&S.user){toast('انتهت الجلسة، سجّل الدخول من جديد');LS.removeItem('tok');S.tok='';S.user=null;return auth()}toast(e.message)}};
const clear=()=>{clearInterval(S.timer);if(S.map){S.map.remove();S.map=null}S.lay={};if(S.watch){navigator.geolocation.clearWatch(S.watch);S.watch=0}};
const cur=()=>S.cfg.countries[S.cc]||{cur:'',f:1,n:''};const money=n=>(+n).toLocaleString('ar-EG',{maximumFractionDigits:2})+' '+cur().cur;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setHTML(el,h){if(!el||el._h===h)return;el._h=h;const act=document.activeElement,id=act&&act.id,v={},sel=act&&act.selectionStart;el.querySelectorAll('input[id],textarea[id]').forEach(i=>v[i.id]=i.value);el.innerHTML=h;for(const k in v){const i=el.querySelector('#'+k);if(i&&v[k]!=='')i.value=v[k]}if(id){const i=el.querySelector('#'+id);if(i){i.focus();try{i.setSelectionRange(sel,sel)}catch{}}}el.querySelectorAll('.chat').forEach(c=>c.scrollTop=c.scrollHeight)}
const av=(u,s=40)=>u&&u.avatar?`<img class=av src="${u.avatar}" width=${s} height=${s} alt="">`:`<span class=av style="width:${s}px;height:${s}px">${esc((u&&u.name||'?')[0])}</span>`;
const topbar=()=>`<div class="top"><b>${esc(S.cfg.logo)}</b><span class=pr>${av(S.user,28)}<span>${esc(S.user.name)}</span><button onclick="notes()" aria-label="الإشعارات">🔔<i id=nb>${S.unread||''}</i></button></span></div><nav class=nav><button onclick="home()">الرئيسية</button>${S.user.role==='driver'?'<button onclick="perf()">لوحة الأداء</button>':''}<button onclick="myRides()">رحلاتي</button><button onclick="profile()">حسابي</button><button onclick="contact()">تواصل معنا</button><button onclick="logout()">خروج</button></nav>`;
const rt=u=>u.rating?`★ ${u.rating} (${u.rn})`:'لا تقييمات بعد';
async function logout(){clear();try{if(S.tok)await api('logout',{})}catch{}LS.removeItem('tok');S.tok='';S.user=null;auth()}

let _L;const loadLeaflet=()=>window.L?Promise.resolve():_L||(_L=new Promise((ok,no)=>{const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.append(l);const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=ok;s.onerror=()=>{_L=null;no(new Error('تعذر تحميل الخريطة، تأكد من الإنترنت'))};document.head.append(s)}));
// ===== الموقع والجهاز والكاميرا =====
const getPos=()=>new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error('المتصفح لا يدعم تحديد الموقع'));navigator.geolocation.getCurrentPosition(p=>{S.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};ok(S.pos)},e=>no(new Error(e.code===1?'تم رفض إذن الموقع. فعّله من إعدادات المتصفح ثم أعد المحاولة':'تعذر تحديد موقعك، تأكد من تشغيل GPS')),{enableHighAccuracy:true,timeout:15000,maximumAge:0})});
async function devInfo(){const d={ua:navigator.userAgent,lang:navigator.language,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,scr:`${screen.width}x${screen.height}@${devicePixelRatio}`,standalone:!!stand()},u=navigator.userAgentData;if(u){d.mobile=u.mobile;d.platform=u.platform;d.brands=(u.brands||[]).map(b=>b.brand+' '+b.version).join(', ');try{const h=await u.getHighEntropyValues(['model','platformVersion']);d.model=h.model;d.osVer=h.platformVersion}catch{}}d.id=LS.did||(LS.did=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()));try{const bb=new TextEncoder().encode([d.ua,d.scr,d.tz,d.lang,d.model,d.platform].join('|'));d.fp=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bb))].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,32)}catch{}return d}
async function ensureLoc(){try{await getPos();return true}catch(e){app.innerHTML=`<div class=pad><h2>الموقع مطلوب</h2><div class=card>${esc(e.message)}<div class=mut style="margin-top:8px">لا يمكن استخدام التطبيق بدون تفعيل الموقع، لسلامتك وسلامة الجميع.</div></div><button class="b a" onclick="home()">إعادة المحاولة</button><button class="b g" style="margin-top:8px" onclick="logout()">خروج</button></div>`;return false}}
function camShot(title){return new Promise((ok,no)=>{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return no(new Error('الكاميرا غير متاحة في هذا المتصفح'));const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000;z-index:9800;display:flex;flex-direction:column';d.innerHTML=`<div style="color:#fff;padding:12px;text-align:center">${esc(title)}</div><video autoplay playsinline muted style="flex:1;min-height:0;width:100%;object-fit:contain"></video><div class=row style="padding:12px"><button class="b a" id=cs>التقاط</button><button class="b g" style="color:#fff" id=cc>إلغاء</button></div>`;document.body.append(d);const v=d.querySelector('video');let st;const end=()=>{st&&st.getTracks().forEach(t=>t.stop());d.remove()};
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(m=>{st=m;v.srcObject=m}).catch(()=>{end();no(new Error('اسمح بالكاميرا لالتقاط الصورة'))});
 d.querySelector('#cc').onclick=()=>{end();no(new Error('تم الإلغاء'))};d.querySelector('#cs').onclick=()=>{if(!v.videoWidth)return;const m=Math.min(1,900/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=v.videoWidth*m;c.height=v.videoHeight*m;c.getContext('2d').drawImage(v,0,0,c.width,c.height);const full=c.toDataURL('image/jpeg',.72),t=document.createElement('canvas'),k=320/Math.max(c.width,c.height);t.width=c.width*k;t.height=c.height*k;t.getContext('2d').drawImage(c,0,0,t.width,t.height);end();ok({full,thumb:t.toDataURL('image/jpeg',.6)})}})}

// ===== تثبيت التطبيق =====
let DI=null;const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),stand=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DI=e;banner()});addEventListener('appinstalled',()=>{$('#inst')&&$('#inst').remove()});
function banner(){if(stand()||$('#inst')||Date.now()-(+LS.noinst||0)<864e5)return;const d=document.createElement('div');d.id='inst';d.innerHTML=`<span>ثبّت «${esc(S.cfg?S.cfg.logo:'وصلني')}» على هاتفك</span><button class="b a s" onclick="doInstall()">تثبيت</button><button class="b g s" onclick="noInst()" aria-label="إغلاق">×</button>`;document.body.prepend(d)}
async function doInstall(){if(DI){DI.prompt();await DI.userChoice;DI=null;LS.seenInstall=1;$('#inst')&&$('#inst').remove()}else toast(ios?'في Safari اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»':'من قائمة المتصفح (⋮) اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»')}
const noInst=()=>{LS.noinst=Date.now();$('#inst')&&$('#inst').remove()};

// ===== الإشعارات =====
const u8=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(s+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0))};
const canPush=()=>'serviceWorker' in navigator&&'PushManager' in window&&typeof Notification!=='undefined';
async function subPush(){const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub){const{key}=await api('vapid');sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(key)})}await api('push',{sub:sub.toJSON()})}
const enablePush=go(async()=>{if(!canPush())throw new Error(ios&&!stand()?'على الآيفون: ثبّت التطبيق على الشاشة الرئيسية أولاً ثم فعّل الإشعارات':'هذا المتصفح لا يدعم الإشعارات');if(await Notification.requestPermission()!=='granted')throw new Error('لم يُسمح بالإشعارات، فعّلها من إعدادات المتصفح');await subPush();toast('تم تفعيل الإشعارات على هذا الجهاز');home()});
const pushCard=()=>typeof Notification!=='undefined'&&Notification.permission==='granted'?'':`<div class=card><b>فعّل الإشعارات</b><div class=mut>لتصلك الطلبات والعروض حتى لو كان التطبيق مغلقاً.</div><button class="b a" style="margin-top:8px" onclick="enablePush()">تفعيل الإشعارات</button></div>`;
async function pollNotes(){if(!S.tok||!S.user)return;try{const r=await api('notes');if(S.seen&&r.unread>S.unread&&r.notes[0])toast('🔔 '+r.notes[0].title+': '+r.notes[0].text);S.unread=r.unread;S.seen=1;const b=$('#nb');if(b)b.textContent=r.unread||''}catch{}}
setInterval(pollNotes,12000);
const notes=go(async()=>{clear();const r=await api('notes');await api('notes/read',{});S.unread=0;app.innerHTML=topbar()+`<div class=pad><h2>الإشعارات</h2>${pushCard()}${r.notes.map(n=>`<div class=card><b>${esc(n.title)}</b><div>${esc(n.text)}</div><div class=mut>${new Date(n.at).toLocaleString('ar-EG')}</div></div>`).join('')||'<div class=mut>لا إشعارات بعد</div>'}</div>`});

// ===== البداية =====
async function boot(){const q=new URLSearchParams(location.search).get('agent');if(q)LS.agent=q.toUpperCase().slice(0,12);const wk=setTimeout(()=>{const l=$('#ld');if(l)l.textContent='الخادم يستيقظ... قد يستغرق حتى دقيقة'},3500);let t=0;
 for(;;){try{S.cfg=await Promise.race([api('config'),new Promise((_,j)=>setTimeout(j,10000))]);if(!S.cfg||!S.cfg.logo)throw 0;break}catch{if(++t>40){clearTimeout(wk);app.innerHTML='<div class=splash><h1>وصلني</h1><div>تعذر الاتصال بالخادم</div><button class="b a" onclick=location.reload()>إعادة المحاولة</button></div>';return}await new Promise(r=>setTimeout(r,2500))}}
 clearTimeout(wk);
 if(S.tok){for(let i=0;i<4;i++){try{S.user=(await api('me')).user;S.cc=S.user.country;break}catch(e){if(e.status===401){S.tok='';LS.removeItem('tok');break}await new Promise(r=>setTimeout(r,3000))}}}
 if(S.user&&canPush()&&Notification.permission==='granted')subPush().catch(()=>{});
 if(!stand()&&!LS.seenInstall)return installPage();splash()}
function installPage(){app.innerHTML=`<div class="splash"><h1>${esc(S.cfg.logo)}</h1><div style="opacity:.9">ثبّت التطبيق على هاتفك لتجربة أسرع وإشعارات فورية.</div><button class="b a" onclick="doInstall()">تثبيت التطبيق</button><button class="b g" style="color:#fff;border-color:#fff6" onclick="LS.seenInstall=1;splash()">متابعة من المتصفح</button></div>`}
function splash(){clear();clearTimeout(S.autoT);app.innerHTML=`<div class="splash"><h1>${esc(S.cfg.logo)}</h1><div style="opacity:.8">كل وسائل المواصلات في تطبيق واحد: توكتوك، سيكل، سيارة، باص، مركب.</div>${S.cfg.ads.map(a=>`<div class="ad"><b>${esc(a.title)}</b><div>${esc(a.text)}</div></div>`).join('')}<div style="height:4px;background:#fff3;border-radius:2px;overflow:hidden"><div id=pg style="height:100%;width:0;background:var(--amber);transition:width 4s linear"></div></div><button class="b a" onclick="next()">${S.user?'متابعة':'ابدأ'}</button></div>`;requestAnimationFrame(()=>{const p=$('#pg');if(p)p.style.width='100%'});S.autoT=setTimeout(next,4000)}
function next(){clearTimeout(S.autoT);if(DI&&!LS.asked){LS.asked=1;try{DI.prompt()}catch{}}S.user?home():S.cc&&S.cfg.countries[S.cc]?auth():country()}
function country(){app.innerHTML=`<div class="pad"><h2>اختر دولتك</h2>${Object.entries(S.cfg.countries).map(([k,c])=>`<button class="b g" style="margin:5px 0;text-align:start" onclick="pick('${k}')">${esc(c.n)} <span class="mut">(${esc(c.cur)})</span></button>`).join('')}</div>`}
function pick(k){S.cc=k;LS.cc=k;auth()}
function auth(mode='login'){clear();const reg=mode==='reg';app.innerHTML=`<div class="pad"><h2>${reg?'حساب جديد':'تسجيل الدخول'} <span class="tag">${esc(cur().n)}</span></h2>
<div class=row style="align-items:flex-start"><span class=tag style="flex:none;margin-top:12px" dir=ltr>+${esc(cur().dial||'')}</span><input id=ph type=tel inputmode=tel placeholder="رقم الموبايل بدون كود الدولة" autocomplete=tel></div>
${reg?`<div class="row"><input id=code inputmode=numeric placeholder="رمز التأكيد"><button class="b a s" onclick="sendOtp()">أرسل الرمز</button></div><input id=nm placeholder="الاسم"><input id=em type=email placeholder="البريد الإلكتروني (مطلوب)" autocomplete=email><select id=role><option value=rider>عميل</option><option value=driver>كابتن</option></select><input id=ac placeholder="كود الوكيل (للكباتن، اختياري)" value="${esc(LS.agent||'')}" autocapitalize=characters>`:''}
<input id=pw type=password placeholder="كلمة السر (8 أحرف على الأقل)" autocomplete="${reg?'new-password':'current-password'}">
${reg?`<label style="display:block;margin-bottom:10px"><input type=checkbox id=tc>أوافق على <a href="#" onclick="showTerms();return false">الشروط والأحكام</a></label>`:''}
<button class="b" onclick="${reg?'doReg()':'doLogin()'}">${reg?'إنشاء الحساب':'دخول'}</button>
<div class=mut style="margin-bottom:8px">يلزم السماح بالموقع لإكمال التسجيل أو الدخول.</div><p style="text-align:center"><a href="#" onclick="auth('${reg?'login':'reg'}');return false">${reg?'لدي حساب':'ليس لدي حساب'}</a> · <a href="#" onclick="country();return false">تغيير الدولة</a>${reg?'':' · <a href="#" onclick="forgot();return false">نسيت كلمة السر؟</a>'}</p></div>`}
function showTerms(){const d=document.createElement('div');d.id='tm';d.style.cssText='position:fixed;inset:0;background:#000a;z-index:9500;display:flex;align-items:center;padding:16px';d.innerHTML=`<div class=card style="max-height:80vh;overflow:auto;white-space:pre-wrap;width:100%;max-width:488px;margin:auto">${esc(S.cfg.terms)}<button class="b" style="margin-top:10px" onclick="$('#tm').remove()">إغلاق</button></div>`;document.body.append(d)}
const sendOtp=go(async()=>{const r=await api('otp',{phone:$('#ph').value,country:S.cc,name:$('#nm').value,email:$('#em').value,role:$('#role').value,dev:await devInfo()});toast(r.devCode?'وضع التجربة: الرمز '+r.devCode:'تم إرسال الرمز برسالة SMS');if(r.devCode)$('#code').value=r.devCode});
const doReg=go(async()=>{const loc=await getPos(),dev=await devInfo();const r=await api('register',{phone:$('#ph').value,code:$('#code').value,name:$('#nm').value,email:$('#em').value,password:$('#pw').value,role:$('#role').value,agentCode:$('#ac').value,country:S.cc,terms:$('#tc').checked,loc,dev});S.tok=LS.tok=r.token;S.user=r.user;home()});
const doLogin=go(async()=>{const loc=await getPos(),dev=await devInfo();const r=await api('login',{phone:$('#ph').value,password:$('#pw').value,country:S.cc,loc,dev});S.tok=LS.tok=r.token;S.user=r.user;S.cc=LS.cc=r.user.country;home()});
function forgot(){app.innerHTML=`<div class=pad><h2>استعادة كلمة السر</h2><input id=fid placeholder="رقم الموبايل أو البريد الإلكتروني"><button class="b a" onclick="sendReset()">أرسل الرمز إلى بريدي</button><div id=fr></div>
<div class=card><b>لا تصلك رسائل البريد؟</b><div class=mut>اطلب مساعدة الإدارة وسيتواصلون معك على رقمك المسجل بعد التحقق من هويتك.</div><button class="b g" style="margin-top:8px" onclick="askAdmin()">اطلب مساعدة الإدارة</button></div>
<div class=card><b>لديك كود من الإدارة؟</b><input id=rcp placeholder="رقم الموبايل"><input id=rcc inputmode=numeric placeholder="الكود (8 أرقام)"><input id=rcn type=password placeholder="كلمة السر الجديدة (8 أحرف)"><button class="b" onclick="useCode()">تغيير كلمة السر</button></div>

const sendReset=go(async()=>{const r=await api('forgot',{id:$('#fid').value,country:S.cc});toast(r.devCode?'وضع التجربة: الرمز '+r.devCode:'أُرسل الرمز إلى '+r.email);$('#fr').innerHTML=`<input id=fc inputmode=numeric placeholder="الرمز" value="${r.devCode||''}"><input id=fp type=password placeholder="كلمة السر الجديدة (8 أحرف)"><button class=b onclick="doReset()">تغيير كلمة السر</button>`});
const doReset=go(async()=>{await api('reset',{id:$('#fid').value,country:S.cc,code:$('#fc').value,password:$('#fp').value});toast('تم تغيير كلمة السر، سجّل الدخول');auth()});
const askAdmin=go(async()=>{const id=$('#fid').value.trim();if(!id)throw new Error('اكتب رقم موبايلك في الخانة العليا أولاً');await api('recover/request',{phone:id,country:S.cc,note:'طلب مساعدة من شاشة استعادة كلمة السر',dev:await devInfo()});toast('وصل طلبك للإدارة وسيتواصلون معك على رقمك المسجل')});
const useCode=go(async()=>{await api('recover/use',{phone:$('#rcp').value,country:S.cc,code:$('#rcc').value,password:$('#rcn').value});toast('تم تغيير كلمة السر، سجّل الدخول');auth()});
function forceChange(){app.innerHTML=`<div class=pad><h2>غيّر كلمة السر المؤقتة</h2><div class=mut>سجّلت الدخول بكلمة سر مؤقتة من الإدارة. اختر كلمة سر جديدة لا يعرفها غيرك.</div><input id=fo type=password placeholder="الكلمة المؤقتة الحالية"><input id=fn type=password placeholder="الجديدة (8 أحرف)"><button class="b a" onclick="doForce()">حفظ ومتابعة</button><button class="b g" style="margin-top:8px" onclick="logout()">خروج</button></div>`}
const doForce=go(async()=>{const r=await api('password',{old:$('#fo').value,new:$('#fn').value});S.tok=LS.tok=r.token;S.user=r.user;home()});
const home=async()=>{clear();if(!await ensureLoc())return;try{S.user=(await api('me')).user}catch(e){if(e.status===401)return logout();}if(!S.ping){S.ping=1;devInfo().then(dev=>api('session',{loc:S.pos,dev})).catch(()=>{})}if(S.user.mustChange)return forceChange();if(S.user.needVerify&&S.user.needVerify.length)return verifyScreen();pollNotes();S.user.role==='driver'?driver():S.user.role==='agent'?agentHome():rider()};
function verifyScreen(){const n=S.user.needVerify,L={phone:'رقم الهاتف',email:'البريد الإلكتروني'};app.innerHTML=`<div class=pad><h2>مطلوب التحقق من بياناتك</h2><div class=mut>طلبت الإدارة التحقق لحمايتك وحماية الجميع.</div>${n.map(k=>`<div class=card><b>${L[k]}</b><div class=mut dir=ltr>${esc(k==='phone'?'+'+S.user.phone:S.user.email)}</div><button class="b a s" onclick="vSend('${k}')">أرسل الرمز</button><div class=row><input id=vc-${k} inputmode=numeric placeholder="الرمز"><button class="b s" onclick="vCheck('${k}')">تحقق</button></div></div>`).join('')}<button class="b g" onclick="logout()">خروج</button></div>`}
const vSend=go(async k=>{const r=await api('verify/send',{kind:k});toast(r.devCode?'وضع التجربة: الرمز '+r.devCode:'أُرسل الرمز');if(r.devCode)$('#vc-'+k).value=r.devCode});
const vCheck=go(async k=>{S.user=(await api('verify/check',{kind:k,code:$('#vc-'+k).value})).user;toast('تم التحقق');home()});

// ===== الحساب والتواصل =====
const profile=go(async()=>{clear();const u=S.user=(await api('me')).user;S.pays=(await api('pay/mine')).payments;app.innerHTML=topbar()+`<div class=pad><h2>حسابي</h2><div class=card><div class=pr>${av(u,80)}<div><b>${esc(u.name)}</b><div class=mut dir=ltr>+${esc(u.phone)}</div>${u.role==='driver'?`<div>${rt(u)}</div>`:''}</div></div><label class=mut>صورتك (اختياري، من الكاميرا أو المعرض)</label><input id=pa type=file accept="image/*"><label class=mut>الاسم</label><input id=pn2 value="${esc(u.name)}"><label class=mut>البريد الإلكتروني (مطلوب)</label><input id=pe type=email value="${esc(u.email||'')}"><div class=mut>${u.pv?'✓ الهاتف موثّق':'الهاتف غير موثّق'} · ${u.ev?'✓ البريد موثّق':'البريد غير موثّق'}</div><button class="b a" onclick="saveProfile()">حفظ</button>${u.avatar?'<button class="b g" style="margin-top:8px" onclick="saveProfile(1)">حذف الصورة</button>':''}</div>
${u.role==='rider'?`<div class=card><div class=mut>رصيدك</div><div class=price>${money(u.wallet)}</div>${(u.tx||[]).map(t=>`<div class=mut>${t.amt>0?'+':''}${money(t.amt)} · ${t.t==='ride'?'رحلة':'شحن'} · ${new Date(t.at).toLocaleDateString('ar-EG')}</div>`).join('')}${anyPay()?`<button class="b a" style="margin-top:8px" onclick="chooseMethod('topup')">اشحن محفظتك إلكترونياً</button>`:''}<button class="b g" style="margin-top:8px" onclick="topup()">اطلب الشحن من الإدارة</button></div>`:''}
${(u.bonuses||[]).length?`<div class=card><b>البونصات</b>${u.bonuses.map(b=>`<div>🎁 ${b.kind==='welcome'?'ترحيبي':'تقدير'}: <b>${money(b.amt)}</b> ${esc(b.msg||'')} <span class=mut>${new Date(b.at).toLocaleDateString('ar-EG')}</span></div>`).join('')}</div>`:''}
${S.pays.length?`<div class=card><b>مدفوعاتي</b>${S.pays.map((p,i)=>`<div class=row style="margin:6px 0"><div>${esc(p.methodName)} · <b>${money(p.amount)}</b> · ${p.kind==='commission'?'عمولة':'محفظة/رحلة'}<div class=mut>${PS[p.status]||p.status}</div></div>${p.status==='pending'?`<button class="b a s" onclick="payModal(S.pays[${i}])">ادفع</button>`:''}</div>`).join('')}</div>`:''}
<div class=card><b>تغيير كلمة السر</b><input id=po type=password placeholder="كلمة السر الحالية"><input id=pn type=password placeholder="الجديدة (8 أحرف)"><button class="b g" onclick="chPass()">تغيير</button></div>${pushCard()}<a href="#" onclick="showTerms();return false">الشروط والأحكام</a><button class="b g" style="margin-top:14px;color:#C0392B" onclick="delAcc()">حذف الحساب</button></div>`});
const topup=go(async()=>{const a=prompt('كم المبلغ الذي تريد شحنه؟');if(!a)return;await api('contact',{type:'topup',text:'طلب شحن المحفظة بمبلغ '+a});toast('وصل طلبك للإدارة وسيتواصلون معك')});
const saveProfile=go(async rm=>{const f=$('#pa').files[0],b={name:$('#pn2').value,email:$('#pe').value};if(rm)b.removeAvatar=1;else if(f)b.avatar=await shrink(f,160,.6);const r=await api('profile',b,'PUT');S.user=r.user;toast('تم الحفظ');profile()});
const chPass=go(async()=>{const r=await api('password',{old:$('#po').value,new:$('#pn').value});S.tok=LS.tok=r.token;toast('تم تغيير كلمة السر');profile()});
const delAcc=go(async()=>{if(!confirm('سيتم تعطيل حسابك. قد نحتفظ بسجلات الأمان وفق القانون. متابعة؟'))return;const p=prompt('اكتب كلمة السر للتأكيد');if(!p)return;await api('account/delete',{password:p});LS.removeItem('tok');S.tok='';S.user=null;toast('تم تعطيل حسابك');auth()});
const contact=go(async()=>{clear();const c=S.cfg.contact||{};app.innerHTML=topbar()+`<div class=pad><h2>تواصل معنا</h2><div class=card>${c.phone?`<div>📞 <a dir=ltr href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>`:''}${c.whatsapp?`<div>💬 <a target=_blank rel=noopener href="https://wa.me/${esc(c.whatsapp.replace(/\D/g,''))}">واتساب</a></div>`:''}${c.email?`<div>✉️ <a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>`:''}${!c.phone&&!c.whatsapp&&!c.email?'<div class=mut>اكتب رسالتك وسنردّ عليك في الإشعارات.</div>':''}</div><div class=card><select id=ct><option value=complaint>شكوى</option><option value=problem>مشكلة في رحلة</option><option value=suggestion>اقتراح</option><option value=topup>شحن المحفظة</option></select><textarea id=cx rows=4 placeholder="اكتب رسالتك" maxlength=1000></textarea><button class="b a" onclick="sendTicket()">إرسال</button></div></div>`});
const sendTicket=go(async()=>{await api('contact',{type:$('#ct').value,text:$('#cx').value});toast('وصلت رسالتك، سنردّ عليك قريباً');home()});
const anyPay=()=>Object.values(S.cfg.pay||{}).some(m=>m.on);
const modal=h=>{$('#pm')&&$('#pm').remove();const d=document.createElement('div');d.id='pm';d.style.cssText='position:fixed;inset:0;background:#000a;z-index:9500;display:flex;align-items:center;padding:16px;overflow:auto';d.innerHTML=`<div class=card style="width:100%;max-width:488px;margin:auto">${h}</div>`;document.body.append(d)};
function chooseMethod(kind,ride){const ms=Object.entries(S.cfg.pay||{}).filter(([,m])=>m.on);if(!ms.length)return toast('الدفع الإلكتروني غير مفعّل حالياً');modal(`<h2>اختر وسيلة الدفع</h2>${ms.map(([k,m])=>`<button class="b a" style="margin:5px 0" onclick="startPay('${kind}','${k}','${ride||''}')">${esc(m.name)}</button>`).join('')}<button class="b g" onclick="$('#pm').remove()">إلغاء</button>`)}
const startPay=go(async(kind,method,ride)=>{$('#pm')&&$('#pm').remove();let r;if(kind==='commission')r=await api('pay/commission',{method});else if(kind==='topup'){const a=prompt('كم المبلغ الذي تريد شحنه؟');if(!a)return;r=await api('pay/online',{kind:'topup',amount:+a,method})}else r=await api('pay/online',{kind:'ride',ride,method});payModal(r.payment)});
function payModal(p){modal(`<h2>الدفع عبر ${esc(p.methodName)}</h2><div class=mut>المبلغ المطلوب (ثابت لا يُعدَّل)</div><div class=price>${money(p.amount)}</div>${p.payee?`<div>حوّل إلى: <b dir=ltr>${esc(p.payee)}</b></div>`:''}${p.note?`<div class=mut>${esc(p.note)}</div>`:''}${p.url?`<a class="b a" style="display:block;text-align:center;text-decoration:none;margin:8px 0" target=_blank rel=noopener href="${esc(p.url)}">افتح صفحة الدفع</a>`:''}<div class=mut style="margin-top:8px">بعد التحويل اكتب رقم العملية كما ظهر لك:</div><input id=pref placeholder="رقم العملية"><button class="b" onclick="submitPay('${p.id}')">تم الدفع</button><button class="b g" style="margin-top:6px" onclick="$('#pm').remove()">لاحقاً</button>`)}
const submitPay=go(async id=>{await api(`pay/${id}/submit`,{ref:$('#pref').value});$('#pm').remove();toast('وصل طلبك، سيؤكد الدفع من الإدارة قريباً')});
const PS={pending:'بانتظار الدفع',submitted:'بانتظار تأكيد الإدارة',confirmed:'مؤكدة ✓',rejected:'مرفوضة'};
const agentHome=go(async()=>{clear();const a=await api('agent/home'),link=location.origin+'/?agent='+a.code;app.innerHTML=topbar()+`<div class=pad><h2>لوحة الوكيل</h2><div class=card><div class=mut>كودك</div><div class=price dir=ltr>${esc(a.code)}</div><div class=mut>رابط تسجيل كباتنك</div><div dir=ltr style="word-break:break-all">${esc(link)}</div><button class="b a" style="margin-top:8px" onclick="navigator.clipboard.writeText('${esc(link)}').then(()=>toast('تم نسخ الرابط'))">نسخ الرابط</button></div><div class=row><div class=card>كباتنك<div class=price>${a.drivers.length}</div></div><div class=card>مستحقاتك<div class=price style="font-size:22px">${money(a.bal)}</div></div></div><div class=card>إجمالي أرباحك: <b>${money(a.earned)}</b><br>نسبتك: <b>${a.agentPct}%</b> من سعر كل رحلة لكباتنك (إجمالي العمولة على الكابتن ${a.driverPct}%)</div><div class=card><b>كباتنك</b>${a.drivers.map(d=>`<div class=card><b>${esc(d.name)}</b> · ${d.status==='approved'?'معتمد':esc(d.status)}<div><a dir=ltr href="tel:+${esc(d.phone)}">+${esc(d.phone)}</a> · ${d.trips} رحلة · لك منه ${money(d.mine)}</div></div>`).join('')||'<div class=mut>لا كباتن بعد. شارك رابطك أو كودك.</div>'}</div><div class=card><b>آخر العمولات</b>${a.recent.map(r=>`<div class=mut>${new Date(r.at).toLocaleDateString('ar-EG')} · ${esc(r.driver||'')} · ${money(r.price)} ← ${money(r.share)}</div>`).join('')||'<div class=mut>لا شيء بعد</div>'}</div></div>`});
const perf=go(async()=>{clear();const c=await api('captain/stats'),pct=Math.min(1,c.todayDone/c.goal),C=2*Math.PI*52;app.innerHTML=topbar()+`<div style="background:#121212;color:#fff;padding:18px;flex:1"><h2>لوحة الأداء</h2><div class=row style="margin-bottom:12px"><div><div style="opacity:.7">اليوم</div><div style="font-size:30px;font-weight:900">${c.todayDone}/${c.goal}</div><div style="opacity:.7">رحلة مكتملة</div></div><svg viewBox="0 0 120 120" width=120 height=120 aria-hidden="true"><circle cx=60 cy=60 r=52 fill=none stroke="#333" stroke-width=10 /><circle cx=60 cy=60 r=52 fill=none stroke="#FFB000" stroke-width=10 stroke-linecap=round stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 60 60)"/></svg></div>${[['معدل القبول',c.acceptRate===null?'—':c.acceptRate+'%',c.acceptRate===null?'':c.acceptRate>=80?'#2ECC71':'#E67E22',`استجبت لـ ${c.responded} من ${c.received} طلب وصلك`],['ساعات الخدمة (اليوم / الأسبوع)',c.hoursToday+' / '+c.hoursWeek+' س','#2ECC71','تُحسب من وقت فتح التطبيق والموقع يعمل'],['الرحلات المكتملة (الأسبوع / الكل)',c.weekDone+' / '+c.total,'#FFB000','أرباح الأسبوع '+money(c.earnedWeek)],['نسبة إتمام الرحلات',c.completeRate===null?'—':c.completeRate+'%','#2ECC71','الإلغاءات منك: '+c.cancels],['الأسابيع النشطة',c.activeWeeks,'#E67E22','أسابيع أتممت فيها رحلة'],['التقييم',c.rating?'★ '+c.rating:'—','#FFB000',c.rn+' تقييم']].map(([t,v,col,sub])=>`<div style="background:#1e1e1e;border-radius:18px;padding:14px;margin:10px 0"><div class=row><div><b>${t}</b><div style="opacity:.65;font-size:13px">${sub}</div></div><div style="flex:none;background:${col||'#444'}33;color:${col||'#fff'};border-radius:10px;padding:6px 12px;font-weight:900;font-size:18px">${v}</div></div></div>`).join('')}</div>`});
const myRides=go(async()=>{clear();const{rides}=await api('history');app.innerHTML=topbar()+`<div class=pad><h2>رحلاتي</h2>${rides.map(r=>`<div class=card><div class=row><b>${esc(S.cfg.vehicles[r.vehicle]?.n||r.vehicle)}</b><span class=tag style="flex:none;background:${r.status==='done'?'#0E7C7B':'#C0392B'}">${r.status==='done'?'مكتملة':'ملغاة'}</span></div><div class=mut>${new Date(r.at).toLocaleString('ar-EG')}</div><div>${esc(r.from||'نقطة على الخريطة')} ← ${esc(r.to||'نقطة على الخريطة')}</div><div class=mut>${r.km} كم${r.who?' · '+esc(r.who):''}${r.whoPhone?` · <a dir=ltr href="tel:+${esc(r.whoPhone)}">+${esc(r.whoPhone)}</a>`:''}${r.pay==='wallet'?' · من الرصيد':''}</div>${r.status==='done'?`<div class=price>${money(r.price)}</div>`:''}</div>`).join('')||'<div class=mut>لا توجد رحلات سابقة بعد.</div>'}</div>`});
function shrink(f,m=900,q=.7){return new Promise((ok,no)=>{const i=new Image;i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};i.onerror=()=>no(new Error('صورة غير صالحة'));i.src=URL.createObjectURL(f)})}
const chat=(r,me)=>`<div class=card><b>المحادثة</b><div class=chat>${(r.msgs||[]).map(m=>`<div class="m ${m.f===me?'me':''}">${esc(m.t)}</div>`).join('')||'<span class=mut>لا رسائل بعد</span>'}</div><div class=row><input id=cm placeholder="اكتب رسالة" maxlength=300><button class="b a s" onclick="sendMsg('${r.id}')">إرسال</button></div></div>`;
const tollBox=(r,me)=>`<div class=card><b>رسوم الطريق (كارتات/عبور)</b>${r.tolls?`<div>المتفق عليه: <b>${money(r.tolls)}</b> ${esc(r.tollNote||'')}</div>`:'<div class=mut>تُضاف إلى الإجمالي ولا تدخل في عمولة المنصة.</div>'}${r.tollProposal&&r.tollProposal.by!==me?`<div class=card>اقتراح من الطرف الآخر: <b>${money(r.tollProposal.amount)}</b> ${esc(r.tollProposal.note||'')}<div class=row><button class="b a s" onclick="tollR('${r.id}',true)">قبول</button><button class="b g s" onclick="tollR('${r.id}',false)">رفض</button></div></div>`:r.tollProposal?`<div class=mut>اقترحت ${money(r.tollProposal.amount)} وبانتظار الرد</div>`:''}<div class=row><input id=tl type=number step=any min=0 placeholder="المبلغ"><input id=tn placeholder="ملاحظة"><button class="b g s" onclick="tollP('${r.id}')">اقترح</button></div></div>`;
const tollP=go(async id=>{await api(`rides/${id}/toll`,{amount:+$('#tl').value,note:$('#tn').value});toast('أُرسل الاقتراح للطرف الآخر')});
const tollR=go(async(id,a)=>{await api(`rides/${id}/toll/respond`,{accept:a})});

async function rider(){clear();const m=await api('rides/mine');if(m.ride)return track(m.ride.id);S.pts={};S.route=null;S.km=0;const vs=S.cfg.vehicles;if(!vs[S.veh])S.veh=Object.keys(vs)[0];
 app.innerHTML=topbar()+`<div id=map></div><div class=sheet>${pushCard()}<div class=chips id=vc></div><div id=pts class="card mut">المس الخريطة لتحديد نقطة الانطلاق ثم الوجهة، أو ابحث عن الوجهة.</div><div class=chips id=favs></div>
 <div class=row><input id=q placeholder="ابحث عن الوجهة"><button class="b g s" onclick="search()">بحث</button><button class="b g s" onclick="myLoc()">موقعي</button></div><div id=sr></div><div id=ex></div><div id=pr></div></div>`;
 drawChips();drawFavs();try{await loadLeaflet()}catch(e){toast(e.message);return}S.map=L.map('map').setView(S.cfg.countries[S.cc]?.c||[26.8,30.8],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(S.map);

const reqCard=x=>{const o=x.offer,ch=[1.05,1.1,1.2].map(f=>Math.round(o*f));return`<div class=card><div class=pr>${av({name:x.riderName,avatar:x.riderAvatar},52)}<div style="flex:1"><b>${esc(x.riderName)}</b><div class=mut>${x.kind==='order'?'طلب توصيل':esc(S.cfg.vehicles[x.vehicle]?.n)} · ${x.km} كم${x.mins?' · ~'+x.mins+' دقيقة':''}</div></div>${x.pickupKm!=null?`<div class=tag>~${x.pickupKm} كم منك</div>`:''}</div><div class=price>${money(o)}</div><div>🅰 ${esc(x.from.name||'نقطة على الخريطة')}</div><div>🅱 ${esc(x.to.name||'نقطة على الخريطة')}</div>${x.kind==='order'&&x.order?`<div class=card><b>${esc(x.order.place)}</b> · ${x.order.qty}× ${esc(x.order.desc)}<div class=mut>سعر الطلب التقريبي ${money(x.order.price)} ${esc(x.order.comment||'')}</div></div>`:`<div class=mut>${x.pax||1} أشخاص${x.assist?' · <b style="color:#C0392B">يحتاج مساعدة (مسن/احتياجات خاصة)</b>':''}${x.bags?' · '+x.bags+' حقائب':''}${x.hours?' · '+x.hours+' ساعة':''}</div>`}<button class="b a" style="margin-top:8px" onclick="drvOffer('${x.id}',0,true)">القبول مقابل ${money(o)}</button><div class=mut style="margin-top:8px">اقترح أجرتك</div><div class=chips>${ch.map(p=>`<button class=chip onclick="drvOffer('${x.id}',${p})">${money(p)}</button>`).join('')}</div><div class=row><input id=o${x.id} type=number step=any placeholder="سعر آخر" value="${x.myOffer||''}"><button class="b g s" onclick="drvOffer('${x.id}',+$('#o${x.id}').value)">أرسل عرضي</button><button class="b g s" onclick="S.skip.add('${x.id}');driver()">تخطي</button></div></div>`};
const NX={assigned:['وصلت للعميل','arrived'],arrived:['ابدأ الرحلة','started'],started:['أنهِ الرحلة','done']};
const curView=r=>`<div class=card><h2>${r.kind==='order'?'طلب توصيل جارٍ':'رحلة جارية'}</h2>${r.payState==='submitted'?'<div class=card style="border-color:#C0392B"><b style="color:#C0392B">العميل حوّل المبلغ إلكترونياً (قيد التأكيد). لا تحصّل الأجرة نقداً.</b></div>':''}<div class=pr>${av({name:r.riderName,avatar:r.riderAvatar},44)}<div><b>${esc(r.riderName)}</b><div><a href="tel:+${esc(r.riderPhone)}" dir=ltr>+${esc(r.riderPhone)}</a></div></div></div>${r.driverKm!==undefined?`<div>المسافة إلى العميل: <b>${r.driverKm} كم</b></div>`:''}<div class=mut>${r.km} كم${r.pax&&r.kind!=='order'?' · '+r.pax+' أشخاص':''}${r.assist?' · <b>يحتاج مساعدة</b>':''}${r.bags?' · '+r.bags+' حقائب':''} · ${r.pay==='wallet'?'الدفع من رصيد العميل (لا تحصّل نقداً)':'حصّل الأجرة نقداً'}</div>${r.order?`<div class=card><b>${esc(r.order.place)}</b> · ${r.order.qty}× ${esc(r.order.desc)}<div class=mut>سعر الطلب التقريبي ${money(r.order.price)} ${esc(r.order.comment||'')}</div></div>`:''}<div class=price>${money(r.total||r.price)}</div>${r.tolls?`<div class=mut>الأجرة ${money(r.price)} + رسوم ${money(r.tolls)} (الرسوم لا تدخل في العمولة)</div>`:''}<a class="b g" style="display:block;text-align:center;margin:6px 0;text-decoration:none" target=_blank href="https://www.google.com/maps/dir/?api=1&destination=${(r.status==='started'?r.to:r.from).lat},${(r.status==='started'?r.to:r.from).lng}">افتح الملاحة</a>${NX[r.status]?`<button class="b a" onclick="step('${r.id}','${NX[r.status][1]}')">${NX[r.status][0]}</button>`:''}${r.status!=='started'?`<button class="b g" style="margin-top:6px" onclick="step('${r.id}','cancelled')">إلغاء</button>`:''}</div>${tollBox(r,'d')}${chat(r,'d')}`;
const step=go(async(id,s)=>{await api(`rides/${id}/status`,{s,loc:S.pos});if(s==='done')toast('تم. حُدّثت أرباحك');if(s==='done'||s==='cancelled')driver()});
const drvOffer=go(async(id,p,accept)=>{if(!accept&&!(p>0))throw new Error('اكتب سعراً');await api(`rides/${id}/offer`,{price:p,accept});toast(accept?'تم قبول الرحلة':'أُرسل عرضك للعميل')});
const shot=go(async(k,t)=>{S.docs[k]=await camShot(t);(k==='id'?$('#pip'):$('#pvp')).innerHTML='<img src="'+S.docs[k].thumb+'" style="width:100%;border-radius:10px">'});
const sendDoc=go(async()=>{const D=S.cfg.docs||{},d=S.docs||{};if(D.vehicle!==false&&!d.vehicle)throw new Error('صوّر المركبة بالكاميرا');if(D.id!==false&&!d.id)throw new Error('صوّر بطاقة الهوية بالكاميرا');await api('driver',{vehicle:$('#dv').value,model:$('#dm').value,plate:$('#dp').value,color:$('#dc').value,photoVehicle:d.vehicle&&d.vehicle.full,thumbVehicle:d.vehicle&&d.vehicle.thumb,photoId:d.id&&d.id.full,live:true},'PUT');S.docs={};driver()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
boot();
</script></body></html>
