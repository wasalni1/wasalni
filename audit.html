<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>المدقق الأمني</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{--ink:#12263A;--bg:#F3F6F8;--card:#fff;--line:#D9E1E7;--txt:#12263A}@media(prefers-color-scheme:dark){:root{--bg:#0C1824;--card:#16293B;--line:#27425A;--txt:#EAF1F6}}
*{box-sizing:border-box}body{margin:0;font:14px/1.6 Tajawal,sans-serif;background:var(--bg);color:var(--txt)}main{max-width:1000px;margin:auto;padding:14px}
input,button{font:inherit;color:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}button{cursor:pointer;font-weight:700}.p{background:#FFB000;color:#12263A;border-color:#FFB000}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;overflow-x:auto}.r{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:start;vertical-align:top}code{font-size:12px;word-break:break-all}.ok{color:#0E7C7B;font-weight:700}.no{color:#C0392B;font-weight:700}img{max-width:200px;border-radius:8px}</style></head><body><main id=m></main>
<script>
const $=s=>document.querySelector(s);let K=sessionStorage.au||'',CUR='';
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function A(p,b){const r=await fetch('/api/audit/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json','x-audit':K},body:b?JSON.stringify(b):undefined});if(r.status===401){K='';sessionStorage.removeItem('au');login();throw new Error('سجّل الدخول')}const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
const W=f=>async(...a)=>{try{await f(...a)}catch(x){alert(x.message)}};
function login(){$('#m').innerHTML='<h2>المدقق الأمني — دخول مقيّد</h2><div class=card><input id=k type=password placeholder="كلمة سر المدقق"> <button class=p onclick="doLogin()">دخول</button><p>كل عملية اطلاع أو تصدير تُسجَّل في السجل الأمني باسم عنوان IP وتوقيتها.</p></div>'}
const doLogin=W(async()=>{const r=await fetch('/api/audit/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#k').value})});const j=await r.json();if(!r.ok)throw new Error(j.error);K=j.token;sessionStorage.au=K;home()});
function home(){$('#m').innerHTML=`<h2>المدقق الأمني</h2><div class=card><div class=r><input id=q placeholder="اسم، هاتف، بريد، أو رقم الحساب" style="flex:1"><button class=p onclick="find()">بحث</button><button onclick="verify()">تحقق من سلامة السجل</button></div><div id=vr></div></div><div id=res></div><div id=d></div>`}
const verify=W(async()=>{const v=await A('verify');$('#vr').innerHTML=v.ok?`<span class=ok>السجل سليم: ${v.count} حدثاً، ولم يُعدَّل شيء.</span> ${v.keyed?'(توقيع بمفتاح سري)':'<br><span class=no>لم يُضبط AUDIT_KEY: يكشف التعديل العادي لكن لا يمنع من يملك قاعدة البيانات وسيرفرها.</span>'}`:`<span class=no>تنبيه: السجل مُعدَّل أو تالف عند الحدث رقم ${v.brokenAt}</span>`});
const find=W(async()=>{const r=await A('find?q='+encodeURIComponent($('#q').value));$('#res').innerHTML=r.users.map(u=>`<div class=card><b>${e(u.name)}</b> · ${e(u.id)} · ${u.role==='driver'?'سائق':'عميل'} · ${e(u.status)}<br>${e(u.phone)} · ${e(u.email||'')} <button onclick="open_('${u.id}')">فتح الملف الأمني</button></div>`).join('')||'لا نتائج'});
const t=x=>x?new Date(x).toLocaleString('en-GB'):'';const g=(la,ln)=>`<a target=_blank rel=noopener href="https://www.google.com/maps?q=${la},${ln}">${(+la).toFixed(5)}, ${(+ln).toFixed(5)}</a>`;
const open_=W(async id=>{CUR=id;const d=await A('user/'+id),a=d.account;$('#d').innerHTML=`<div class=card><h3>الحساب</h3><table>${[['الرقم الداخلي',a.id],['الاسم',a.name],['الهاتف',a.phone+(a.pv?' ✓ موثّق':'')],['البريد',(a.email||'')+(a.ev?' ✓ موثّق':'')],['النوع',a.role],['الحالة',a.status],['الدولة',a.country],['تاريخ التسجيل',t(a.created)],['موقع التسجيل',a.regLoc?g(a.regLoc.lat,a.regLoc.lng)+' (دقة '+a.regLoc.acc+' م)':''],['آخر دخول',t(a.lastLogin)],['المركبة',[a.vehicle,a.model,a.plate,a.color].filter(Boolean).join(' · ')],['مستندات بالكاميرا',a.docsLive?'نعم (يقرّ بها التطبيق)':''],['بصمة صورة الهوية SHA-256',a.photoIdSha256||'']].map(([k,v])=>`<tr><th>${k}</th><td>${v&&String(v).startsWith('<a')?v:e(v)}</td></tr>`).join('')}</table>${a.photoId?`<img src="${a.photoId}"> `:''}${a.photoVehicle?`<img src="${a.photoVehicle}">`:''}<div class=r><button class=p onclick="rep()">تنزيل التقرير الأمني الكامل (JSON)</button></div></div>
<div class=card><h3>عناوين IP (${d.ips.length})</h3>${d.ips.map(x=>`<code>${e(x)}</code>`).join(' · ')||'—'}</div>
<div class=card><h3>الأجهزة (${d.devices.length})</h3><table><tr><th>أول ظهور</th><th>الموديل</th><th>النظام</th><th>المنصة</th><th>الشاشة</th><th>اللغة/المنطقة</th></tr>${d.devices.map(x=>`<tr><td>${t(x.firstSeen)}</td><td>${e(x.model||'')} ${e(x.brands||'')}</td><td>${e(x.os||'')} ${e(x.osVer||'')}</td><td>${e(x.platform||'')} ${x.standalone?'(مثبّت)':''}</td><td>${e(x.scr||'')}</td><td>${e(x.lang||'')} ${e(x.tz||'')}</td></tr>`).join('')}</table></div>
<div class=card><h3>الرحلات (${d.rides.length})</h3>${d.rides.map(r=>`<div class=card><b>${e(r.id)}</b> · ${e(r.status)} · ${t(r.at)} · ${r.km} كم · ${e(r.vehicle)} · سعر ${r.price??r.offer} · ${e(r.pay)}<br>الراكب: ${e(r.riderName)} ${e(r.riderPhone)} · السائق: ${e(r.driverId||'—')}<br>من ${g(r.from.lat,r.from.lng)} إلى ${g(r.to.lat,r.to.lng)} · مسار مخطط: ${r.route?r.route.length+' نقطة':'خط مستقيم'}<br>مسار السائق الفعلي: ${(r.tracks&&r.tracks.d||[]).length} نقطة · مسار الراكب: ${(r.tracks&&r.tracks.r||[]).length} نقطة${r.tracks&&r.tracks.d.length?`<details><summary>نقاط السائق (وقت، موقع، دقة)</summary><table>${r.tracks.d.map(p=>`<tr><td>${t(p[0])}</td><td>${g(p[1],p[2])}</td><td>${p[3]} م</td></tr>`).join('')}</table></details>`:''}${r.tracks&&r.tracks.r.length?`<details><summary>نقاط الراكب</summary><table>${r.tracks.r.map(p=>`<tr><td>${t(p[0])}</td><td>${g(p[1],p[2])}</td><td>${p[3]} م</td></tr>`).join('')}</table></details>`:''}${(r.msgs||[]).length?`<details><summary>المحادثة (${r.msgs.length})</summary>${r.msgs.map(m=>`<div>${t(m.at)} ${m.f==='r'?'الراكب':'السائق'}: ${e(m.t)}</div>`).join('')}</details>`:''}</div>`).join('')||'—'}</div>
<div class=card><h3>سجل الأحداث (${d.events.length})</h3><table><tr><th>#</th><th>الوقت</th><th>الحدث</th><th>IP</th><th>التفاصيل</th></tr>${d.events.map(x=>`<tr><td>${x.i}</td><td>${t(x.at)}</td><td>${e(x.ev)}</td><td><code>${e(x.ip||'')}</code></td><td><code>${e(JSON.stringify(x.d))}</code></td></tr>`).join('')}</table></div>`;window.scrollTo(0,$('#d').offsetTop)});
const rep=W(async()=>{const r=await fetch('/api/audit/report/'+CUR,{headers:{'x-audit':K}});if(!r.ok)throw new Error((await r.json()).error);const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='security-report-'+CUR+'.json';a.click()});
K?home():login();
</script></body></html>
